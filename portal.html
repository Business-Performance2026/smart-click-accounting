<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>فواتيري</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e4e7ec;--pri:#0f766e;--pri2:#e5f3f1;--red:#b4381a;--redbg:#fdeee8;--amber:#94600a;--amberbg:#fdf4dc;--green:#17803d;--greenbg:#e8f6ed;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top img{max-height:52px;max-width:120px}
.top .co{flex:1;min-width:0}
.top .co b{display:block;font-size:17px}
.top .co span{color:var(--mute);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;min-height:38px;white-space:nowrap}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.hello{font-size:13px;color:var(--mute)}
.hello b{display:block;color:var(--ink);font-size:20px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--mute)}
.stat .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#fafbfc}
.item .m{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{font-size:12.5px;color:var(--mute);margin-top:2px}
.item .a{text-align:end;font-weight:600;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:600;background:#eef0f3;color:var(--mute)}
.b-green{background:var(--greenbg);color:var(--green)}.b-red{background:var(--redbg);color:var(--red)}.b-amber{background:var(--amberbg);color:var(--amber)}.b-pri{background:var(--pri2);color:var(--pri)}
.neg{color:var(--red)}
.empty{padding:28px;text-align:center;color:var(--mute)}
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:24px;text-align:center;color:var(--mute);font-size:12.5px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2230;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;display:none;z-index:9}
#toast.on{display:block}
/* paper (printable) */
.paperwrap{overflow-x:auto;background:#e9ebef;border-radius:var(--r);padding:12px;container-type:inline-size}
.paper{font-family:'IBM Plex Sans Arabic',Arial,Tahoma,sans-serif;background:#fff;color:#111;width:100%;max-width:794px;margin:0 auto;padding:34px 34px 28px;font-size:13px;line-height:1.55}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #0f766e;padding-bottom:14px}
.paper .co b{font-size:18px;display:block}
.paper .co div{color:#444;font-size:12px}
.paper .logo{max-height:70px;max-width:170px}
.paper .ttl{text-align:center;margin:16px 0 12px}
.paper .ttl b{font-size:19px;display:block}
.paper .ttl span{font-size:12px;color:#555;letter-spacing:normal}
.paper .meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}
.paper .meta .bx{border:1px solid #ddd;border-radius:8px;padding:8px 12px;flex:1}
.paper .meta .bx div{display:flex;justify-content:space-between;gap:10px}
.paper .meta .bx div span:first-child{color:#666}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#0f766e;color:#fff;font-weight:600;padding:7px 8px;text-align:start;font-size:12px;line-height:1.3}
.paper td{padding:7px 8px;border-bottom:1px solid #e3e3e3}
.paper td.n,.paper th.n{text-align:end}
.paper td.pimg{width:52px;padding:4px 6px}
.paper td.pimg img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid #e3e3e3;display:block}
.paper .pe{color:#666;font-size:.86em;font-weight:400}
.paper th .pe{color:#d6efe9}
.paper .num{display:inline-block;direction:ltr;unicode-bidi:normal}
.paper td.num{display:table-cell}
.paper[dir=rtl] td.n.num{text-align:left}
.paper .sum{display:flex;justify-content:space-between;gap:20px;margin-top:14px}
.paper .sum .notes{flex:1;font-size:12px;color:#333;white-space:pre-wrap}
.paper .sum table{width:300px}
.paper .sum td{border:0;padding:4px 8px}
.paper .sum tr.big td{font-weight:700;font-size:15px;background:#e5f3f1;border-radius:4px}
.paper .foot{margin-top:28px;display:flex;justify-content:space-between;font-size:12px;color:#555}
.paper .foot div{border-top:1px solid #bbb;padding-top:6px;width:180px;text-align:center}
.paper .terms{margin-top:18px;font-size:11.5px;color:#555;white-space:pre-wrap;border-top:1px dashed #ccc;padding-top:8px}
.paper td.num,.paper td.n{white-space:nowrap}
@container (max-width:620px){
 .paperwrap .paper{padding:18px 14px;font-size:12px}
 .paperwrap .paper .meta,.paperwrap .paper .sum{flex-direction:column;gap:10px}
 .paperwrap .paper .sum table{width:100%}
 .paperwrap .paper th,.paperwrap .paper td{padding:6px 4px}
 .paperwrap .paper .ph{gap:10px}
 /* phone: each item becomes a small card instead of a wide table row */
 .paperwrap .paper table.lines tr.lh{display:none}
 .paperwrap .paper table.lines tr{display:flex;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid #e3e3e3;padding:6px 0}
 .paperwrap .paper table.lines td{border:0;padding:3px 4px}
 .paperwrap .paper table.lines td.li{width:22px;color:#888}
 .paperwrap .paper table.lines td.pimg{width:52px}
 .paperwrap .paper table.lines td.lnm{flex:1 1 calc(100% - 90px);min-width:0;font-weight:600}
 .paperwrap .paper table.lines td.ldesc{flex:1 1 100%;max-width:none;padding-inline-start:26px;font-size:11.5px}
 .paperwrap .paper table.lines td.lc{flex:1 1 0;min-width:0;text-align:center!important;white-space:nowrap}
 .paperwrap .paper table.lines td.lc::before{content:attr(data-l);display:block;font-size:10.5px;color:#888;font-weight:400}
 .paperwrap .paper table.lines td.lt{font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty"><span class="spin"></span></div></div>
<div id="toast"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round((+n||0)*1000)/1000).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const fdate=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:''};
let LANG=(()=>{try{return localStorage.getItem('plang')||''}catch(_){return ''}})();
const T=(ar,en)=>LANG==='en'?en:ar;
const token=new URLSearchParams(location.search).get('t')||'';
let P=null,tab='inv',open=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
function setDir(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='en'?'ltr':'rtl'}
function render(){
  setDir();
  const a=$('#app');
  if(!P){a.innerHTML=`<div class="card" style="margin-top:40px;text-align:center"><div style="font-size:36px">🔒</div><h2>${T('الرابط غير صالح','Invalid link')}</h2><p style="color:var(--mute)">${T('قد يكون الرابط قديماً أو تم إلغاؤه. تواصل مع الشركة للحصول على رابط جديد.','The link may be old or revoked. Contact the company for a new link.')}</p></div>`;return}
  const c=P.company,cu=P.customer,cur=LANG==='en'&&P.currency==='ر.ع.'?'OMR':P.currency;
  const coName=LANG==='en'?(c.nameEn||c.name):(c.name||c.nameEn);
  const cuName=LANG==='en'?(cu.nameEn||cu.name):cu.name;
  const due=P.invoices.reduce((s,x)=>s+Math.max(0,x.total-x.paid),0);
  const wa=c.phone?`https://wa.me/${(c.phone.replace(/\D/g,'').length===8?'968':'')+c.phone.replace(/\D/g,'')}`:'';
  const head=`<div class="top">${P.logo?`<img src="${esc(P.logo)}" alt="">`:''}<div class="co"><b>${esc(coName)}</b><span>${T('بوابة العميل','Customer portal')}</span></div><button class="btn ghost" id="lang">🌐 ${LANG==='en'?'العربية':'English'}</button></div>`;
  if(open){
    const it=[...P.invoices,...P.quotes,...P.payments].find(x=>x.id===open)||(open==='__stmt'?{no:T('كشف الحساب','Statement'),html:P.statement}:null);
    if(it){
      a.innerHTML=`${head}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" id="back">${LANG==='en'?'←':'→'} ${T('رجوع','Back')}</button><button class="btn pri" id="pdf">⬇︎ ${T('تنزيل PDF','Download PDF')}</button></div>
      <div class="paperwrap"><div class="paper" id="paper" dir="${P.printLang==='en'?'ltr':'rtl'}">${it.html}</div></div>`;
      a.querySelectorAll('img[data-logo]').forEach(i=>{if(P.logo)i.src=P.logo;else i.remove()});
      a.querySelectorAll('img[data-pimg]').forEach(i=>{const v=(P.images||{})[i.dataset.pimg];if(v)i.src=v;else i.remove()});
      $('#back').onclick=()=>{open=null;render();scrollTo(0,0)};
      $('#pdf').onclick=()=>pdf(it.html,`${it.no||'document'}.pdf`);
      $('#lang').onclick=toggleLang;return;
    }
    open=null;
  }
  const status=x=>`<span class="badge ${x.st.cls}">${esc(LANG==='en'?x.st.en:x.st.ar)}</span>`;
  const list=tab==='inv'?P.invoices.map(x=>`<div class="item" data-id="${esc(x.id)}"><div class="m"><div class="t num">${esc(x.no)}</div><div class="d">${fdate(x.date)} ${status(x)}</div></div><div class="a"><span class="num">${fmt(x.total)}</span>${x.total-x.paid>0.0005?`<div class="d neg">${T('المتبقي','Due')} <span class="num">${fmt(x.total-x.paid)}</span></div>`:''}</div></div>`)
    :tab==='q'?P.quotes.map(x=>`<div class="item" data-id="${esc(x.id)}"><div class="m"><div class="t num">${esc(x.no)}</div><div class="d">${fdate(x.date)}${x.due?` · ${T('صالح حتى','Valid until')} ${fdate(x.due)}`:''} ${status(x)}</div></div><div class="a num">${fmt(x.total)}</div></div>`)
    :P.payments.map(x=>`<div class="item" data-id="${esc(x.id)}"><div class="m"><div class="t num">${esc(x.no)}</div><div class="d">${fdate(x.date)}${x.inv?` · <span class="num">${esc(x.inv)}</span>`:''}</div></div><div class="a num">${fmt(x.amount)}</div></div>`);
  a.innerHTML=`${head}
  <div class="card"><div class="hello">${T('مرحباً','Welcome')}<b>${esc(cuName)}</b></div>
   <div class="stats"><div class="stat"><div class="k">${T('الرصيد المستحق','Balance due')}</div><div class="v ${P.balance>0.0005?'neg':''}"><span class="num">${fmt(P.balance)}</span> <small style="font-size:12px;font-weight:500">${esc(cur)}</small></div></div>
   <div class="stat"><div class="k">${T('عدد الفواتير','Invoices')}</div><div class="v num">${P.counts.invoices}</div></div>
   <div class="stat"><div class="k">${T('فواتير غير مدفوعة','Unpaid invoices')}</div><div class="v num">${P.invoices.filter(x=>x.total-x.paid>0.0005).length}</div></div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="stmt">📄 ${T('كشف الحساب','Statement')}</button>${wa?`<a class="btn" href="${wa}" target="_blank" rel="noopener">💬 ${T('تواصل واتساب','WhatsApp us')}</a>`:''}</div></div>
  <div class="tabs"><button data-tab="inv" class="${tab==='inv'?'on':''}">${T('الفواتير','Invoices')}</button>${P.quotes.length?`<button data-tab="q" class="${tab==='q'?'on':''}">${T('عروض الأسعار','Quotations')}</button>`:''}${P.payments.length?`<button data-tab="p" class="${tab==='p'?'on':''}">${T('المدفوعات','Payments')}</button>`:''}</div>
  <div class="list">${list.join('')||`<div class="empty">${T('لا توجد بيانات','Nothing here yet')}</div>`}</div>
  ${P.counts.shown<P.counts.invoices&&tab==='inv'?`<p style="color:var(--mute);font-size:12.5px">${T('تظهر أحدث الفواتير وكل غير المدفوعة. للفواتير الأقدم تواصل معنا.','Showing recent and all unpaid invoices. Contact us for older ones.')}</p>`:''}
  <div class="foot">${esc(coName)}${c.phone?` · <span class="num">${esc(c.phone)}</span>`:''}${c.email?` · ${esc(c.email)}`:''}<br>${T('آخر تحديث','Last updated')}: ${fdate(P.updatedAt)}</div>`;
  a.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{open=el.dataset.id;render();scrollTo(0,0)});
  a.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render()});
  $('#stmt').onclick=()=>{open='__stmt';render();scrollTo(0,0)};
  $('#lang').onclick=toggleLang;
}
function toggleLang(){LANG=LANG==='en'?'ar':'en';try{localStorage.setItem('plang',LANG)}catch(_){}render()}
const libs={};
function lib(u){return libs[u]||(libs[u]=new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)}))}
async function pdf(html,filename){
  toast(T('جارِ تجهيز الملف…','Preparing file…'));
  try{await Promise.all([lib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}catch(e){toast(T('تعذر التحميل','Could not load'));return}
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff';
  host.innerHTML=`<div class="paper" dir="${P.printLang==='en'?'ltr':'rtl'}" style="width:794px;max-width:none;min-height:1123px">${html}</div>`;
  host.querySelectorAll('img[data-logo]').forEach(i=>{if(P.logo)i.src=P.logo;else i.remove()});
  host.querySelectorAll('img[data-pimg]').forEach(i=>{const v=(P.images||{})[i.dataset.pimg];if(v)i.src=v;else i.remove()});
  host.querySelectorAll('.num').forEach(el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))n.nodeValue=n.nodeValue.replace(/-/g,'‑').replace(/ /g,' ')});
  document.body.appendChild(host);
  try{
    if(document.fonts)await document.fonts.ready;
    const cv=await window.html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#fff',logging:false});
    const {jsPDF}=window.jspdf;const p=new jsPDF({unit:'mm',format:'a4'});const per=Math.floor(cv.width*297/210);let y=0,first=true;
    while(y<cv.height-4){const h=Math.min(per,cv.height-y);const c=document.createElement('canvas');c.width=cv.width;c.height=h;c.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);if(!first)p.addPage();first=false;p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,h*210/cv.width);y+=h}
    const blob=p.output('blob');const f=new File([blob],filename,{type:'application/pdf'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:filename});return}catch(e){if(e.name==='AbortError')return}}
    const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
    $('#toast').classList.remove('on');
  }catch(e){console.error(e);toast(T('تعذر إنشاء الملف','Could not create the file'))}finally{host.remove()}
}
(async()=>{
  if(!/^[A-Za-z0-9_-]{16,}$/.test(token)){P=null;if(!LANG)LANG='ar';render();return}
  try{
    const db=getFirestore(initializeApp(firebaseConfig));
    const s=await getDoc(doc(db,'portal',token));
    P=s.exists()?s.data():null;
  }catch(e){console.error(e);P=null}
  if(!LANG)LANG=P&&P.printLang==='en'?'en':'ar';
  document.title=P?(LANG==='en'?(P.company.nameEn||P.company.name):P.company.name)||document.title:document.title;
  render();
})();
</script>
</body>
</html>

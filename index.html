<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نظام الإدارة والمحاسبة والمخزون</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<meta name="theme-color" content="#13202e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المحاسبة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e4e7ec;--pri:#0f766e;--pri-d:#0b5d57;--pri2:#e5f3f1;--red:#b4381a;--redbg:#fdeee8;--amber:#94600a;--amberbg:#fdf4dc;--green:#17803d;--greenbg:#e8f6ed;--side:#13202e;--r:12px}
*{box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:15px;letter-spacing:normal;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:normal}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:900px){input,select,textarea{font-size:16px!important}}
a{color:var(--pri)}
#app{display:flex;min-height:100vh}
#side{width:236px;background:var(--side);color:#c9d3df;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 10px}
#side .brand{color:#fff;font-weight:700;font-size:16px;padding:4px 12px 16px;line-height:1.4}
#side .brand .blogo{display:block;max-width:150px;max-height:56px;object-fit:contain;background:#fff;border-radius:10px;padding:6px 8px;margin-bottom:10px}
#tb-logo{height:30px;max-width:90px;object-fit:contain;border-radius:6px;background:#fff;padding:2px 4px;margin-inline-start:6px}
#side .brand small{display:block;color:#8ea0b4;font-weight:400;font-size:12px}
#side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:inherit;text-decoration:none;margin-bottom:2px;font-size:14.5px}
#side a:hover{background:#1b2d3f}
#side a.on{background:#20384f;color:#fff}
#side a.navh{margin-top:2px}
#side a.navh.act{color:#fff}
#side .chev{transition:transform .15s;opacity:.7}
#side .chev.open{transform:rotate(-90deg)}
[dir=ltr] #side .chev{transform:rotate(180deg)}
[dir=ltr] #side .chev.open{transform:rotate(90deg)}
#side a.sub{padding-inline-start:26px;font-size:14px}
.acc-c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:box-shadow .12s,border-color .12s}
.acc-c:hover{border-color:#cfd5de;box-shadow:0 4px 14px rgba(20,30,45,.07)}
.acc-h{display:flex;align-items:center;gap:10px}
.acc-i{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-n{font-weight:600}
.acc-s{font-size:12px;color:var(--mute)}
.acc-b{font-size:22px;font-weight:700;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.acc-f{display:flex;gap:12px;font-size:12px;color:var(--mute)}
#side .ic{width:22px;text-align:center}
#scrim{display:none}
main{flex:1;min-width:0;padding:20px 28px 100px}
#bottom{display:none}
#topbar{display:none}
body.authmode #side,body.authmode #bottom,body.authmode #topbar,body.authmode #banner{display:none!important}
body.authmode main{margin:0 auto}
@media(max-width:860px){
 #side{position:fixed;right:0;top:0;z-index:60;display:none;box-shadow:-8px 0 30px rgba(0,0,0,.2);max-width:85vw}
 #side.open{display:block;animation:sidein .18s ease-out}
 @keyframes sidein{from{transform:translateX(100%)}to{transform:none}}
 [dir=ltr] #side{right:auto;left:0}
 [dir=ltr] #side.open{animation-name:sideinl}
 @keyframes sideinl{from{transform:translateX(-100%)}to{transform:none}}
 #scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
 main{padding:0 12px 96px}
 #topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 2px;margin-bottom:4px}
 #topbar b{font-size:16px}
 #bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 #bottom a{flex:1;text-align:center;padding:7px 0 6px;font-size:11px;color:var(--mute);text-decoration:none}
 #bottom a span{display:block;font-size:19px;line-height:1.3}
 #bottom a.on{color:var(--pri);font-weight:600}
}
h1{font-size:22px;margin:6px 0 16px}
h2{font-size:19px;margin:0}
h3{font-size:16px;margin:0 0 10px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.head h1,.head h2{margin:0;flex:1;min-width:150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{border-color:#c8ced8}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.red{color:var(--red)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.grid>*,.qa>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.g2.f,.g3.f{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:4px}
input,select,textarea{border:1px solid #d5dae2;border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:15px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{min-height:auto;width:18px;height:18px;vertical-align:middle;flex-shrink:0;margin:0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:12.5px;color:var(--mute)}
.stat .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--mute);margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#fafbfc}
.item .m{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:12.5px;color:var(--mute);margin-top:2px}
.item .a{text-align:end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mute)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:600;background:#eef0f3;color:var(--mute)}
.b-green{background:var(--greenbg);color:var(--green)}
.b-red{background:var(--redbg);color:var(--red)}
.b-amber{background:var(--amberbg);color:var(--amber)}
.b-pri{background:var(--pri2);color:var(--pri)}
.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search input{flex:1;min-width:160px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--mute)}
.neg{color:var(--red)}
.pos{color:var(--green)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:start;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:end}
html[dir=rtl] table.t td.n.num{text-align:left}
.tw{overflow-x:auto}
.tw table.t{min-width:560px}
table.t td.num,table.t td.n{white-space:nowrap}
.banner{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.banner.info{background:var(--pri2);color:var(--pri-d)}
/* editor lines */
.ln{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfcfd}
.ln .r1{display:flex;gap:8px;align-items:center}
.ln .r1 input{flex:1}
.ln .l-desc{width:100%;min-height:38px;margin-top:8px;resize:vertical;font-size:13.5px;padding:7px 10px}
.paper td.ldesc{white-space:pre-wrap;color:#333;font-size:12px;max-width:260px}
.ln .r2{display:grid;grid-template-columns:.9fr 1.2fr 1.5fr 1.1fr;gap:8px;margin-top:8px}
.ln .r2>label{min-width:0}
.ln .r2 input{min-width:0;width:100%}
.ln .r2 label{font-size:11.5px}
.ln .tot{min-height:40px;display:flex;align-items:center;font-weight:700;margin-top:4px}
.ln .stk{font-size:11.5px;color:var(--mute);margin-top:4px}
.totals{width:100%}
.totals td{padding:5px 0}
.totals td:last-child{text-align:end;font-weight:600}
.totals tr.big td{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px}
.sticky-act{position:sticky;bottom:70px;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);padding-top:14px}
@media(min-width:861px){.sticky-act{bottom:0}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,23,35,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal.open{display:flex}
#modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:861px){#modal{align-items:center}#modal .box{border-radius:16px}}
#modal h3{font-size:17px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1c2230;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;display:none;max-width:90vw;text-align:center}
#toast.on{display:block}
/* paper (printable) */
.paperwrap{overflow-x:auto;background:#e9ebef;border-radius:var(--r);padding:12px;container-type:inline-size}
.paper{font-family:'IBM Plex Sans Arabic',Arial,Tahoma,sans-serif;background:#fff;color:#111;width:100%;max-width:794px;margin:0 auto;padding:34px 34px 28px;font-size:13px;line-height:1.55}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #0f766e;padding-bottom:14px}
.paper .co b{font-size:18px;display:block}
.paper .co div{color:#444;font-size:12px}
.paper .logo{max-height:70px;max-width:170px}
.paper .ttl{text-align:center;margin:16px 0 12px}
.paper .ttl b{font-size:19px;display:block}
.paper .ttl span{font-size:12px;color:#555;letter-spacing:normal}
.paper .meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}
.paper .meta .bx{border:1px solid #ddd;border-radius:8px;padding:8px 12px;flex:1}
.paper .meta .bx div{display:flex;justify-content:space-between;gap:10px}
.paper .meta .bx div span:first-child{color:#666}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#0f766e;color:#fff;font-weight:600;padding:7px 8px;text-align:start;font-size:12px;line-height:1.3}
.paper td{padding:7px 8px;border-bottom:1px solid #e3e3e3}
.paper td.n,.paper th.n{text-align:end}
.paper .pe{color:#666;font-size:.86em;font-weight:400}
.paper th .pe{color:#d6efe9}
.paper .num{display:inline-block;direction:ltr;unicode-bidi:normal}
.paper td.num{display:table-cell}
.paper[dir=rtl] td.n.num{text-align:left}
.paper .sum{display:flex;justify-content:space-between;gap:20px;margin-top:14px}
.paper .sum .notes{flex:1;font-size:12px;color:#333;white-space:pre-wrap}
.paper .sum table{width:300px}
.paper .sum td{border:0;padding:4px 8px}
.paper .sum tr.big td{font-weight:700;font-size:15px;background:#e5f3f1;border-radius:4px}
.paper .foot{margin-top:28px;display:flex;justify-content:space-between;font-size:12px;color:#555}
.paper .foot div{border-top:1px solid #bbb;padding-top:6px;width:180px;text-align:center}
.paper .terms{margin-top:18px;font-size:11.5px;color:#555;white-space:pre-wrap;border-top:1px dashed #ccc;padding-top:8px}
.paper td.num,.paper td.n{white-space:nowrap}
@container (max-width:620px){
 .paperwrap .paper{padding:18px 14px;font-size:12px}
 .paperwrap .paper .meta,.paperwrap .paper .sum{flex-direction:column;gap:10px}
 .paperwrap .paper .sum table{width:100%}
 .paperwrap .paper th,.paperwrap .paper td{padding:6px 4px}
 .paperwrap .paper .ph{gap:10px}
 /* phone: each item becomes a small card instead of a wide table row */
 .paperwrap .paper table.lines tr.lh{display:none}
 .paperwrap .paper table.lines tr{display:flex;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid #e3e3e3;padding:6px 0}
 .paperwrap .paper table.lines td{border:0;padding:3px 4px}
 .paperwrap .paper table.lines td.li{width:22px;color:#888}
 .paperwrap .paper table.lines td.pimg{width:52px}
 .paperwrap .paper table.lines td.lnm{flex:1 1 calc(100% - 90px);min-width:0;font-weight:600}
 .paperwrap .paper table.lines td.ldesc{flex:1 1 100%;max-width:none;padding-inline-start:26px;font-size:11.5px}
 .paperwrap .paper table.lines td.lc{flex:1 1 0;min-width:0;text-align:center!important;white-space:nowrap}
 .paperwrap .paper table.lines td.lc::before{content:attr(data-l);display:block;font-size:10.5px;color:#888;font-weight:400}
 .paperwrap .paper table.lines td.lt{font-weight:700}
}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute)}
.legend i,#tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:14px;background:#f0f2f5;border-radius:4px;overflow:hidden}
.hb-b{height:100%;border-radius:4px}
.hb-v{font-size:12.5px;color:var(--ink);min-width:58px;text-align:end}
.hb:hover .hb-t{background:#e6e9ee}
#tip{position:fixed;z-index:150;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:8px 12px;font-size:13px;display:none;min-width:150px;line-height:1.7}
#tip.on{display:block}
#tip div{display:flex;align-items:center;gap:6px}
#tip .num{margin-inline-start:auto;font-weight:600;padding-inline-start:10px}
.qa{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:16px}
.qa-c{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.qa-c:hover{border-color:#cfd5de;box-shadow:0 4px 14px rgba(20,30,45,.07);transform:translateY(-1px)}
.qa-c:active{transform:scale(.97)}
.qa-i{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa-t{font-size:13px;font-weight:600;text-align:center;line-height:1.3;overflow-wrap:anywhere}
@media(max-width:1100px){.qa{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:420px){.stat{padding:12px}.stat .v{font-size:18px}.head h1{font-size:20px}main{padding:0 10px 96px}}
@media(max-width:520px){.qa{gap:8px}.qa-c{padding:12px 4px 10px;border-radius:12px}.qa-i{width:42px;height:42px}.qa-t{font-size:12px}}
.dsc{display:flex;align-items:stretch;gap:0;margin-top:4px}
.dsc input{flex:1;min-width:0;border-start-end-radius:0;border-end-end-radius:0;margin:0}
.dsc-t{border:1px solid #d5dae2;border-inline-start:0;background:var(--pri2);color:var(--pri-d);font-weight:700;border-start-end-radius:9px;border-end-end-radius:9px;padding:0 8px;min-width:36px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.dsc-t:hover{background:#d3ebe7}
.scan-wrap{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;color:#fff}
.scan-top{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(0,0,0,.6)}
.scan-top b{flex:1;font-size:16px}
.scan-top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;min-height:40px;min-width:44px;font-size:18px;cursor:pointer}
.scan-vid{position:relative;flex:1;overflow:hidden;background:#000}
.scan-vid video{width:100%;height:100%;object-fit:cover}
.scan-box{position:absolute;left:50%;top:45%;width:min(78vw,420px);height:min(34vw,180px);transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scan-box::after{content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:scl 1.6s ease-in-out infinite}
@keyframes scl{0%,100%{transform:translateY(-40px)}50%{transform:translateY(40px)}}
.scan-box.hit{border-color:#3ddc84}
.scan-bot{padding:12px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.7)}
.scan-msg{min-height:22px;font-size:15px;text-align:center;margin-bottom:10px}
.scan-bot form{display:flex;gap:8px}
.scan-bot input{flex:1;background:#1c2230;border-color:#3a4458;color:#fff}
.scan-log{max-height:96px;overflow:auto;font-size:13px;color:#cfd8e3;margin-bottom:8px}
.btn.icon{min-width:40px;padding:0 10px}
.pthumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:#f0f2f5;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#b5bcc8}
.l-img{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex-shrink:0}
.pimg-box{display:flex;gap:12px;align-items:center;grid-column:1/-1;background:#f8f9fb;border:1px dashed #cfd5de;border-radius:12px;padding:10px}
.pimg-box img,.pimg-box .ph{width:84px;height:84px;border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;color:#b5bcc8}
.crop-wrap{position:fixed;inset:0;z-index:310;background:rgba(10,14,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff}
.crop-cv{width:min(86vw,380px);height:min(86vw,380px);border-radius:14px;touch-action:none;cursor:grab;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.crop-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;width:min(86vw,380px)}
.crop-ctl input[type=range]{flex:1;min-width:140px;accent-color:#3ddc84}
.crop-ctl .btn{min-height:40px}
.seg{background:#eef1f5;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#4a5568;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:#fff;color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

// Arabic-letter-aware phrase replacement (longest first)
const EN_KEYS=Object.keys(EN).sort((a,b)=>b.length-a.length);
const AR_RE=/[؀-ۿ]/;
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const EN_PHRASES=EN_KEYS.filter(k=>AR_RE.test(k)&&(/\s/.test(k.trim())||k.length>=7||k==='ر.ع.')).map(k=>[k.trim(),new RegExp('(?<![\\u0600-\\u06FF])'+escRe(k.trim())+'(?![\\u0600-\\u06FF])','g'),EN[k]]);
function trText(s){
  if(!s||!AR_RE.test(s))return s;
  const t=s.trim();
  if(EN[t]!==undefined) return s.replace(t,EN[t]);
  let out=s;
  for(const [k,re,v] of EN_PHRASES){if(out.includes(k))out=out.replace(re,v)}
  // single words only if every remaining Arabic word is known (avoid touching names)
  const words=out.match(/[؀-ۿ]+/g);
  if(words&&words.every(w=>EN[w]!==undefined)) out=out.replace(/[؀-ۿ]+/g,w=>EN[w]);
  return out;
}
function trTree(root){
  if(LANG!=='en'||!root)return;
  if(root.nodeType===3){if(!skipNode(root.parentElement))root.nodeValue=trText(root.nodeValue);return}
  if(root.nodeType!==1||skipNode(root))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1?(skipNode(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP):NodeFilter.FILTER_ACCEPT});
  const nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
  for(const t of nodes){const v=trText(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v}
  const els=[root,...root.querySelectorAll('[placeholder],[title],[aria-label],option')];
  for(const el of els){if(el.closest&&el.closest('[translate=no],.paper'))continue;for(const a of ['placeholder','title','aria-label']){const v=el.getAttribute&&el.getAttribute(a);if(v&&AR_RE.test(v))el.setAttribute(a,trText(v))}}
}
function skipNode(el){return !!(el&&el.closest&&el.closest('[translate=no],.paper,script,style,textarea,datalist'))}
let trObs=null;
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='en'?'ltr':'rtl';
  if(trObs){trObs.disconnect();trObs=null}
  if(LANG==='en'){
    trObs=new MutationObserver(ms=>{for(const m of ms){for(const n of m.addedNodes)trTree(n)}});
    trObs.observe(document.body,{childList:true,subtree:true});
    trTree(document.body);
  }
}

let D=null,Dver=-1;
function derive(){
  if(Dver===ver&&D) return D;
  const stock=new Map(),cq=new Map(),cv=new Map(),avg=new Map(),paid=new Map(),cust=new Map(),sup=new Map();
  for(const p of S.products){const o=num(p.opening);stock.set(p.id,o);cq.set(p.id,o);cv.set(p.id,o*num(p.cost));}
  const dRatio=d=>num(d.sub)>0?(num(d.sub)-num(d.discount))/num(d.sub):1;
  for(const d of S.purchases){const rt=dRatio(d);for(const l of d.lines||[]){if(!l.productId||l.noStock||!stock.has(l.productId))continue;const q=num(l.qty);stock.set(l.productId,stock.get(l.productId)+q);cq.set(l.productId,cq.get(l.productId)+q);cv.set(l.productId,cv.get(l.productId)+num(l.total)*rt);}}
  for(const d of S.sales){for(const l of d.lines||[]){if(!l.productId||l.noStock||!stock.has(l.productId))continue;stock.set(l.productId,stock.get(l.productId)-num(l.qty));}}
  for(const d of S.workorders){if(d.status!=='done'&&d.status!=='invoiced')continue;for(const l of d.lines||[]){if(!l.productId||!stock.has(l.productId))continue;stock.set(l.productId,stock.get(l.productId)-num(l.qty));}}
  for(const d of S.sreturns){for(const l of d.lines||[]){if(!l.productId||!stock.has(l.productId))continue;stock.set(l.productId,stock.get(l.productId)+num(l.qty));}}
  for(const d of S.preturns){const rt=dRatio(d);for(const l of d.lines||[]){if(!l.productId||!stock.has(l.productId))continue;const q=num(l.qty);stock.set(l.productId,stock.get(l.productId)-q);cq.set(l.productId,cq.get(l.productId)-q);cv.set(l.productId,cv.get(l.productId)-num(l.total)*rt);}}
  for(const p of S.products){const q=cq.get(p.id);avg.set(p.id,q>0?cv.get(p.id)/q:num(p.cost));}
  for(const c of S.customers) cust.set(c.id,num(c.opening));
  for(const s of S.suppliers) sup.set(s.id,num(s.opening));
  for(const d of S.sales) if(d.partyId&&cust.has(d.partyId)) cust.set(d.partyId,cust.get(d.partyId)+num(d.total));
  for(const d of S.purchases) if(d.partyId&&sup.has(d.partyId)) sup.set(d.partyId,sup.get(d.partyId)+num(d.total));
  const ret=new Map(),cash=new Map(),retDoc=new Map();
  for(const d of S.sreturns){retDoc.set(d.id,d);if(d.partyId&&cust.has(d.partyId))cust.set(d.partyId,cust.get(d.partyId)-num(d.total));if(d.invoiceId){ret.set(d.invoiceId,(ret.get(d.invoiceId)||0)+num(d.total));paid.set(d.invoiceId,(paid.get(d.invoiceId)||0)+num(d.total))}}
  for(const d of S.preturns){retDoc.set(d.id,d);if(d.partyId&&sup.has(d.partyId))sup.set(d.partyId,sup.get(d.partyId)-num(d.total));if(d.invoiceId){ret.set(d.invoiceId,(ret.get(d.invoiceId)||0)+num(d.total));paid.set(d.invoiceId,(paid.get(d.invoiceId)||0)+num(d.total))}}
  const acc=new Map(ACCS().map(x=>[x.id,num(x.opening)]));
  const addAcc=(id,v)=>{if(!id)return;acc.set(id,(acc.get(id)||0)+v)};
  for(const p of S.payments){
    const a=num(p.amount);
    if(p.type==='tr'){addAcc(p.fromAcc,-a);addAcc(p.toAcc,a);continue}
    if(!p.noCash)addAcc(payAcc(p),p.type==='in'?a:-a);
    if(p.invoiceId){paid.set(p.invoiceId,(paid.get(p.invoiceId)||0)+a);cash.set(p.invoiceId,(cash.get(p.invoiceId)||0)+a)}
    if(p.returnId){const r=retDoc.get(p.returnId);if(r&&r.invoiceId){paid.set(r.invoiceId,(paid.get(r.invoiceId)||0)-a);cash.set(r.invoiceId,(cash.get(r.invoiceId)||0)-a)}}
    if(p.partyType==='customer'&&cust.has(p.partyId)) cust.set(p.partyId,cust.get(p.partyId)+(p.type==='in'?-a:a));
    if(p.partyType==='supplier'&&sup.has(p.partyId)) sup.set(p.partyId,sup.get(p.partyId)+(p.type==='out'?-a:a));
  }
  D={stock,avg,paid,cust,sup,acc,ret,cash};Dver=ver;return D;
}
function returnedQty(invId,exceptId){
  const m=new Map();const d=S.sreturns.find(x=>x.invoiceId===invId)?S.sreturns:S.preturns;
  for(const r of [...S.sreturns,...S.preturns]){if(r.invoiceId!==invId||r.id===exceptId)continue;for(const l of r.lines||[]){const k=l.productId||'n:'+l.name;m.set(k,(m.get(k)||0)+num(l.qty))}}
  return m;
}
const curSym=()=>{const c=ST().currency||'ر.ع.';return LANG==='en'&&c==='ر.ع.'?'OMR':c};
const lineTotal=l=>{const g=num(l.qty)*num(l.price);return r3(l.discType==='a'?g-num(l.disc):g-g*num(l.disc)/100)};
const discLabel=l=>num(l.disc)?(l.discType==='a'?fmt(l.disc):fq(l.disc)+'%'):'';
function calc(d){
  let sub=0,vb=0;
  for(const l of d.lines||[]){l.total=lineTotal(l);sub+=l.total;if(!l.noVat)vb+=l.total}
  sub=r3(sub);vb=r3(vb);const discount=d.discType==='p'?r3(sub*num(d.discPct)/100):r3(num(d.discount));const taxable=r3(sub-discount);
  // VAT only on lines that are subject to it; the invoice discount is shared across lines in proportion
  const vatBase=d.vatOn?(vb===sub?taxable:r3(vb-(sub>0?discount*vb/sub:0))):0;
  const vat=d.vatOn?r3(vatBase*num(d.vatRate)/100):0;
  return {sub,discount,taxable,vatBase,vat,total:r3(taxable+vat)};
}
const effDue=d=>d.due||(d.date?addDays(d.date,num(ST().overdueDays)||30):'');
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
function overdueSales(){
  const t=today(),pd=derive().paid;
  return S.sales.map(x=>{const rem=r3(num(x.total)-(pd.get(x.id)||0));const due=effDue(x);return {x,rem,due,late:due&&due<t?daysBetween(due,t):0}})
    .filter(o=>o.rem>0.0005&&o.late>0).sort((a,b)=>b.late-a.late||b.rem-a.rem);
}
function invStatus(kind,d){
  if(isWO(kind)){const x=WO_ST[d.status]||WO_ST.new;return [x[0],x[2]]}
  if(isRet(kind)){const rf=S.payments.some(p=>p.returnId===d.id);return rf?['تم رد المبلغ','b-green']:['خصم من الرصيد','b-pri']}
  if(kind==='porders'){
    if(d.status==='received') return ['تم الاستلام','b-green'];
    if(d.status==='cancelled') return ['ملغي','b-red'];
    if(d.due&&d.due<today()) return ['متأخر التوريد','b-amber'];
    return ['مفتوح','b-pri'];
  }
  if(kind==='quotes'){
    if(d.status==='converted') return ['تم تحويله لفاتورة','b-green'];
    if(d.status==='rejected') return ['مرفوض','b-red'];
    if(d.due&&d.due<today()) return ['منتهي الصلاحية','b-amber'];
    return ['مفتوح','b-pri'];
  }
  const p=derive().paid.get(d.id)||0,t=num(d.total);
  if(t<=0.0005||p>=t-0.0005) return ['مدفوعة','b-green'];
  const ed=kind==='sales'?effDue(d):d.due;
  if(ed&&ed<today()) return [p>0?'متأخرة (جزئي)':'متأخرة','b-red'];
  if(p>0) return ['مدفوعة جزئياً','b-amber'];
  return ['غير مدفوعة','b-red'];
}
const productByKey=key=>{const k=norm(key);if(!k)return null;return S.products.find(p=>norm(p.name)===k)||S.products.find(p=>p.nameEn&&norm(p.nameEn)===k)||S.products.find(p=>p.code&&norm(p.code)===k)||null};
const dn=o=>o?(LANG==='en'&&o.nameEn?o.nameEn:o.name):'';
const partyByName=(col,name)=>{const k=norm(name);return k?S[col].find(x=>norm(x.name)===k)||S[col].find(x=>x.nameEn&&norm(x.nameEn)===k)||null:null};

async function W(fn,okMsg){

async function saveAppt(id){

function icsAppt(id){
  const a=S._appointments.get(id);if(!a)return;
  const st=(a.date+'T'+(a.time||'09:00')).replace(/[-:]/g,'')+'00';
  const end=new Date(`${a.date}T${a.time||'09:00'}:00`);end.setMinutes(end.getMinutes()+(num(a.duration)||60));
  const p=n=>String(n).padStart(2,'0');const en=`${end.getFullYear()}${p(end.getMonth()+1)}${p(end.getDate())}T${p(end.getHours())}${p(end.getMinutes())}00`;
  const e=s=>String(s||'').replace(/[\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const ty=apType(a);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SmartClick//Accounting//AR','BEGIN:VEVENT',`UID:${id}@smartclick`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART:${st}`,`DTEND:${en}`,`SUMMARY:${e(T(ty[0],ty[1])+' — '+a.customerName)}`,`LOCATION:${e(a.location)}`,`DESCRIPTION:${e(a.notes)}`,'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  saveFile(`${a.date}-${(a.customerName||'appointment').replace(/[\\/:*?"<>|]/g,'')}.ics`,new Blob([ics],{type:'text/calendar'}));
}

    const prefs=pushPrefsFromUI();const id=token.replace(/\//g,'_').slice(0,700);

  }catch(e){console.error(e);toast(e&&e.code==='permission-denied'?T('لا توجد صلاحية: الصق ملف firestore.rules الجديد في Firebase.','No permission: paste the new firestore.rules into Firebase.'):T('تعذر التفعيل: ','Could not enable: ')+(e&&e.message||'').slice(0,90),6000)}
}

/* ---------- low stock ---------- */
function lowStockItems(){
  const st=derive().stock;
  return S.products.filter(p=>!p.service&&num(p.minQty)>0&&(st.get(p.id)||0)<=num(p.minQty)+0.0005)
    .map(p=>{const q=r3(st.get(p.id)||0);return {p,q,min:num(p.minQty),sug:Math.max(1,Math.ceil(num(p.minQty)*2-q))}})
    .sort((a,b)=>(a.q-a.min)-(b.q-b.min));
}
function lastSupplierOf(pid){let best=null;for(const d of S.purchases)if(d.partyId&&(d.lines||[]).some(l=>l.productId===pid)&&(!best||(d.date||'')>(best.date||'')))best=d;return best?best.partyId:''}
function lowStockPO(){
  const items=lowStockItems();if(!items.length){toast(T('لا توجد أصناف ناقصة','No low-stock items'));return}
  const cnt=new Map();items.forEach(it=>{const s=lastSupplierOf(it.p.id);if(s)cnt.set(s,(cnt.get(s)||0)+1)});
  const sup=[...cnt].sort((a,b)=>b[1]-a[1])[0];const sid=sup?sup[0]:'';
  const pick=sid?items.filter(it=>{const s=lastSupplierOf(it.p.id);return !s||s===sid}):items;
  const d=newDocData('porders',sid);
  d.lines=pick.map(it=>({productId:it.p.id,name:it.p.name,nameEn:it.p.nameEn||'',qty:it.sug,price:num(it.p.cost),disc:0}));
  openEditor('porders',null,d);
  if(pick.length<items.length)toast(T(`أُضيفت أصناف المورد الأكثر توريداً. باقي ${items.length-pick.length} صنف لموردين آخرين.`,`Added items for the main supplier. ${items.length-pick.length} items belong to other suppliers.`),6000);
}

let SNI=null,SNIver=-1;
function serialIndex(){
  if(SNI&&SNIver===ver)return SNI;
  const m=new Map();const t=today();
  const pur=new Map();for(const d of S.purchases)for(const l of d.lines||[])for(const sn of l.serials||[])pur.set(sn.toUpperCase(),{supplier:d.partyName,purDate:d.date,purNo:docNo('purchases',d.no),purId:d.id});
  const addSale=(d,l,src)=>{for(const sn of l.serials||[]){const p=l.productId&&S._products.get(l.productId);const months=num(l.warranty)||(p?num(p.warrantyMonths):0);const date=src==='wo'?(d.due||d.date):d.date;
    m.set(sn.toUpperCase(),{sn,productId:l.productId||'',name:l.name,invId:d.id,invNo:src==='wo'?docNo('workorders',d.no):docNo('sales',d.no),kind:src==='wo'?'workorders':'sales',customerId:d.partyId,customerName:d.partyName,date,months,until:months?addMonths(date,months):'',...(pur.get(sn.toUpperCase())||{})})}};
  for(const d of S.workorders){if(d.status==='done'&&!d.invoiceId)for(const l of d.lines||[])addSale(d,l,'wo')}
  for(const d of S.sales)for(const l of d.lines||[])addSale(d,l,'sale');
  for(const r of S.sreturns)for(const l of r.lines||[])for(const sn of l.serials||[]){const x=m.get(sn.toUpperCase());if(x&&r.date>=x.date){x.returned=true;x.retNo=docNo('sreturns',r.no)}}
  for(const x of m.values()){x.left=x.until?daysBetween(t,x.until):null;x.state=x.returned?'returned':!x.months?'none':x.left<0?'expired':x.left<=30?'soon':'active'}
  SNI=m;SNIver=ver;return m;
}
const SN_STATE={active:['ساري','Active','b-green'],soon:['ينتهي قريباً','Expiring soon','b-amber'],expired:['منتهي','Expired','b-red'],none:['بدون ضمان','No warranty',''],returned:['مُرتجع','Returned','b-pri']};

let PIMG=null; // pending image change in the product form: {full,thumb} or {remove:true}
function openCropper(file,done){

     <div style="font-size:12.5px;color:#aab4c3">${T('اسحب الصورة لتحريكها، وكبّر بالشريط أو بإصبعين','Drag to move, zoom with the slider or two fingers')}</div></div>`;
    const cv=$('#crop-cv');const dpr=Math.min(2,window.devicePixelRatio||1);const W=cv.clientWidth;cv.width=W*dpr;cv.height=W*dpr;const ctx=cv.getContext('2d');
    const st={z:1,ox:0,oy:0,mode:'cover',rot:0};
    const dims=()=>st.rot%180?[img.height,img.width]:[img.width,img.height];
    const geom=size=>{const [iw,ih]=dims();const base=st.mode==='cover'?Math.max(size/iw,size/ih):Math.min(size/iw,size/ih);const sc=base*st.z;const dw=iw*sc,dh=ih*sc;return {sc,dw,dh}};
    const clamp=()=>{const {dw,dh}=geom(W);if(st.mode==='cover'){const mx=Math.max(0,(dw-W)/2),my=Math.max(0,(dh-W)/2);st.ox=Math.max(-mx,Math.min(mx,st.ox));st.oy=Math.max(-my,Math.min(my,st.oy))}else{const mx=Math.max((W-dw)/2,(dw-W)/2),my=Math.max((W-dh)/2,(dh-W)/2);st.ox=Math.max(-mx,Math.min(mx,st.ox));st.oy=Math.max(-my,Math.min(my,st.oy))}};
    const paint=(c,size,k)=>{const {sc}=geom(size);c.fillStyle='#fff';c.fillRect(0,0,size,size);c.save();c.translate(size/2+st.ox*k,size/2+st.oy*k);c.rotate(st.rot*Math.PI/180);c.drawImage(img,-img.width*sc/2,-img.height*sc/2,img.width*sc,img.height*sc);c.restore()};
    const draw=()=>{clamp();ctx.setTransform(dpr,0,0,dpr,0,0);paint(ctx,W,1)};
    draw();

    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:st.z}}};
    cv.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];st.z=Math.max(1,Math.min(4,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));$('#crop-z').value=st.z;draw();return}
      if(last){st.ox+=e.clientX-last.x;st.oy+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};draw()}};
    cv.onpointerup=cv.onpointercancel=e=>{ptrs.delete(e.pointerId);pinch=null;last=ptrs.size?[...ptrs.values()][0]:null};
    cv.onwheel=e=>{e.preventDefault();st.z=Math.max(1,Math.min(4,st.z*(e.deltaY<0?1.08:0.93)));$('#crop-z').value=st.z;draw()};
    $('#crop-z').oninput=e=>{st.z=num(e.target.value);draw()};
    const setMode=m=>{st.mode=m;st.ox=st.oy=0;$('#crop-cover').classList.toggle('on',m==='cover');$('#crop-contain').classList.toggle('on',m==='contain');draw()};
    $('#crop-cover').onclick=()=>setMode('cover');$('#crop-contain').onclick=()=>setMode('contain');
    $('#crop-rot').onclick=()=>{st.rot=(st.rot+90)%360;st.ox=st.oy=0;draw()};
    const close=()=>{box.className='hide';box.innerHTML='';URL.revokeObjectURL(url)};
    $('#crop-cancel').onclick=close;
    $('#crop-ok').onclick=()=>{
      const out=(size,q)=>{const c=document.createElement('canvas');c.width=c.height=size;paint(c.getContext('2d'),size,size/W);return c.toDataURL('image/jpeg',q)};

    };
  };

}

/* ---------- camera barcode scanner ---------- */
let SCAN=null;
function beep(){try{const a=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=1500;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.09)}catch(_){}try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}}
async function openScanner(opts){
  // opts: {title, continuous, onCode(code)=>({ok,msg})}
  closeScanner();
  const el=$('#scanner');el.className='';
  el.innerHTML=`<div class="scan-wrap"><div class="scan-top"><button data-act="scanClose" aria-label="close">✕</button><b>${esc(opts.title||T('مسح الباركود','Scan barcode'))}</b><button id="scan-torch" class="hide" data-act="scanTorch" aria-label="torch">🔦</button></div>
   <div class="scan-vid"><video id="scan-v" playsinline muted autoplay></video><div class="scan-box" id="scan-box"></div></div>
   <div class="scan-bot"><div class="scan-log" id="scan-log"></div><div class="scan-msg" id="scan-msg">${T('وجّه الكاميرا نحو الباركود','Point the camera at the barcode')}</div>
   <form id="scan-f"><input id="scan-in" placeholder="${T('أو اكتب الكود يدوياً','or type the code')}" dir="ltr" autocomplete="off" inputmode="text"><button class="btn pri">${T('إضافة','Add')}</button></form></div></div>`;
  const S2=SCAN={opts,last:'',lastAt:0,stream:null,timer:null,reader:null,done:false};
  const msg=(t,ok)=>{const m=$('#scan-msg');if(m){m.textContent=t;m.style.color=ok===false?'#ffb4a2':ok?'#9ff0c4':'#fff'}};
  const handle=(code,manual)=>{
    code=String(code||'').trim();if(!code||S2.done)return;
    // the same barcode counts again only after it has left the camera view for a moment
    const now=Date.now();if(!manual&&code===S2.last&&now-S2.lastAt<1200){S2.lastAt=now;return}S2.last=code;S2.lastAt=now;
    const r=opts.onCode(code)||{};
    if(r.ok!==false){beep();const b=$('#scan-box');if(b){b.classList.add('hit');setTimeout(()=>b&&b.classList.remove('hit'),350)}}
    msg(r.msg||code,r.ok);
    if(r.ok!==false&&opts.continuous){const lg=$('#scan-log');if(lg){lg.insertAdjacentHTML('afterbegin',`<div>✓ ${esc(r.msg||code)}</div>`)}}
    if(r.ok!==false&&!opts.continuous){S2.done=true;setTimeout(closeScanner,250)}
  };
  S2.handle=handle;
  $('#scan-f').onsubmit=e=>{e.preventDefault();const i=$('#scan-in');handle(i.value,true);i.value=''};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg(T('الكاميرا غير متاحة في هذا المتصفح. اكتب الكود يدوياً.','Camera not available in this browser. Type the code.'),false);return}
  const v=$('#scan-v');
  try{
    S2.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(SCAN!==S2){S2.stream.getTracks().forEach(t=>t.stop());return}
    v.srcObject=S2.stream;await v.play().catch(()=>{});
    const track=S2.stream.getVideoTracks()[0];try{const cap=track.getCapabilities&&track.getCapabilities();if(cap&&cap.torch)$('#scan-torch').classList.remove('hide')}catch(_){}
  }catch(e){
    console.warn(e);msg(e&&e.name==='NotAllowedError'?T('اسمح للمتصفح باستخدام الكاميرا من إعدادات الموقع، ثم حاول مرة أخرى.','Allow camera access in the site settings, then try again.'):T('تعذر تشغيل الكاميرا. يمكنك كتابة الكود يدوياً.','Could not start the camera. You can type the code.'),false);return;
  }
  const FORMATS=['ean_13','ean_8','code_128','code_39','code_93','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];
  let det=null;
  if('BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();const f=FORMATS.filter(x=>sup.includes(x));if(f.length)det=new BarcodeDetector({formats:f})}catch(_){det=null}}

  }else{
    try{await lib('zxing')}catch(_){msg(T('تعذر تحميل قارئ الباركود. اكتب الكود يدوياً.','Could not load the scanner. Type the code.'),false);return}
    if(SCAN!==S2)return;
    const Z=window.ZXing;const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const reader=new Z.MultiFormatReader();reader.setHints(hints);const cv=document.createElement('canvas');const cx=cv.getContext('2d',{willReadFrequently:true});
    const loop=()=>{if(SCAN!==S2)return;try{if(v.readyState>=2&&v.videoWidth){const sc=Math.min(1,900/v.videoWidth);cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);cx.drawImage(v,0,0,cv.width,cv.height);
      const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)));const res=reader.decodeWithState(bmp);if(res)handle(res.getText())}}catch(_){/* not found in this frame */}
      S2.timer=setTimeout(loop,220)};loop();
  }
}
function closeScanner(){
  const S2=SCAN;SCAN=null;
  if(S2){clearTimeout(S2.timer);try{S2.reader&&S2.reader.reset()}catch(_){}if(S2.stream)S2.stream.getTracks().forEach(t=>t.stop());if(S2.opts.onClose)try{S2.opts.onClose()}catch(_){}}

}
async function scanTorch(){const S2=SCAN;if(!S2||!S2.stream)return;const t=S2.stream.getVideoTracks()[0];S2.torch=!S2.torch;try{await t.applyConstraints({advanced:[{torch:S2.torch}]})}catch(_){}}
// lookup a scanned code: product code/barcode, or a serial number recorded on a purchase
function lookupCode(code){
  const k=norm(code);
  const p=S.products.find(x=>x.code&&norm(x.code)===k)||S.products.find(x=>norm(x.name)===k);
  if(p)return {product:p};
  for(const d of S.purchases)for(const l of d.lines||[])if(l.productId&&(l.serials||[]).some(sn=>norm(sn)===k)){const pp=S._products.get(l.productId);if(pp)return {product:pp,serial:code}}
  return null;
}
function scanIntoEditor(){
  if(!E)return;
  openScanner({title:T('مسح الأصناف للفاتورة','Scan items into the document'),continuous:true,onCode:code=>{
    if(!E)return {ok:false};
    const f=lookupCode(code);
    if(!f)return {ok:false,msg:T('غير موجود: ','Not found: ')+code};
    const p=f.product;E.d.lines=readLines();
    let l=E.d.lines.find(x=>x.productId===p.id);
    if(l){if(f.serial){if((l.serials||[]).some(x=>norm(x)===norm(f.serial)))return {ok:false,msg:T('الرقم مضاف مسبقاً: ','Already added: ')+f.serial};l.serials=[...(l.serials||[]),f.serial]}l.qty=r3(num(l.qty)+1)}
    else{
      const price=KIND[E.kind].party==='suppliers'?num(p.cost):num(p.price);
      l={productId:p.id,name:p.name,...(p.desc?{desc:String(p.desc).trim()}:{}),qty:1,price,disc:0,serials:f.serial?[f.serial]:[]};
      const empty=E.d.lines.findIndex(x=>!x.name);if(empty>=0)E.d.lines.splice(empty,1,l);else E.d.lines.push(l);
    }
    if(!E.d.lines.some(x=>!x.name))E.d.lines.push({productId:'',name:'',qty:1,price:'',disc:0});
    renderLines();updTotals();
    return {ok:true,msg:`${p.name}${f.serial?' · '+f.serial:''} — ${T('الكمية','Qty')} ${fq(l.qty)}`};
  }});
}
function scanSerialsInto(btn){

// Shared stocktake: counts live in Firestore (stocktake/current) so every device and employee works on the same count.
let STK={},STK_META={},STK_READY=false;
const saveSTK=()=>{};
const stkRef=()=>window.FB.fns.doc(FB.fs,'stocktake/current');
function stkWrite(data){
  if(!db)return;const F=window.FB.fns;
  const p=F.setDoc(stkRef(),{...data,updatedAt:nowIso(),updatedBy:MYID||''},{merge:true});
  if(p&&p.catch)p.catch(e=>{console.error('stocktake',e);toast(e&&e.code==='permission-denied'?T('لا توجد صلاحية لحفظ الجرد. ارفع القواعد الجديدة (firebase deploy --only firestore:rules).','No permission to save the count. Deploy the new rules.'):T('تعذر حفظ الجرد','Could not save the count'),6000)});
}
const stkSet=(id,v)=>{STK[id]=Math.max(0,r3(v));stkWrite({counts:{[id]:STK[id]},who:{[id]:MYID||''}})};
const stkAdd=(id,n)=>{STK[id]=Math.max(0,r3(num(STK[id])+n));stkWrite({counts:{[id]:n>0?window.FB.fns.increment(n):STK[id]},who:{[id]:MYID||''}})};
function stkListen(){
  if(!db||!can('products',1))return;
  window.FB.fns.onSnapshot(stkRef(),snap=>{
    const d=(snap.exists&&snap.exists())?snap.data():null;const remote=d&&d.counts||{};
    // one-time move of a count that was kept on this device before
    if(!STK_READY){STK_READY=true;let old={};try{old=JSON.parse(localStorage.getItem('stocktake')||'{}')}catch(_){}
      const ids=Object.keys(old).filter(k=>num(old[k])>0&&remote[k]==null);
      if(ids.length&&can('products',2)){stkWrite({counts:Object.fromEntries(ids.map(k=>[k,num(old[k])])),who:Object.fromEntries(ids.map(k=>[k,MYID||'']))});ids.forEach(k=>remote[k]=num(old[k]))}
      try{localStorage.removeItem('stocktake')}catch(_){}}
    const focused=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('stk-q')?document.activeElement.dataset.id:null;
    const before=Object.keys(STK).sort().join(',');
    const next={};for(const k in remote)if(remote[k]!=null)next[k]=num(remote[k]);
    if(focused&&STK[focused]!=null)next[focused]=STK[focused];
    STK=next;STK_META=d?{startedAt:d.startedAt,updatedAt:d.updatedAt,updatedBy:d.updatedBy,who:d.who||{}}:{};
    if(sub&&sub.type==='stocktake'&&!E){
      if(!focused&&!$('#scanner.open')&&Object.keys(STK).sort().join(',')!==before)render();
      else{$$('.stk-q').forEach(i=>{if(i.dataset.id!==focused&&STK[i.dataset.id]!=null)i.value=fq(STK[i.dataset.id])});stkRefresh()}
    }else if(route==='products'&&!sub&&!E)schedule();
  },e=>console.warn('stocktake',e&&e.code));
}

  ${rows.length?`<div class="sticky-act"><div class="btns">${RO?'':`<button class="btn pri" id="stk-apply" data-act="stkApply" style="flex:1;min-height:46px" ${diffs.length?'':'disabled'}>✓ ${T('تطبيق التسوية','Apply adjustment')} (<span id="stk-n">${diffs.length}</span>)</button>`}<button class="btn red" data-act="stkClear" style="min-height:46px">${T('مسح الجرد','Clear count')}</button></div></div>`:''}`;
};
AFTER.stocktake=()=>{
  const a=$('#stk-add');if(a)a.onchange=()=>{const v=a.value;if(!v.trim())return;const f=lookupCode(v);if(f){a.value='';if(!can('products',2))return deny();stkAdd(f.product.id,1);render()}else toast(T('غير موجود','Not found'))};
  // update live while typing (no re-render, so a tap on the button right after typing isn't lost)
  $$('.stk-q').forEach(i=>{let t=null;i.oninput=()=>{if(i.value.trim()==='')return;STK[i.dataset.id]=num(i.value);stkRefresh();clearTimeout(t);t=setTimeout(()=>{if(can('products',2))stkSet(i.dataset.id,num(i.value))},600)};i.onchange=()=>{clearTimeout(t);if(!can('products',2))return deny();stkSet(i.dataset.id,num(i.value));stkRefresh()}});
};
function stkSync(){$$('.stk-q').forEach(i=>{if(i.value.trim()!==''&&num(i.value)!==num(STK[i.dataset.id]))stkSet(i.dataset.id,num(i.value))})}
function stkRefresh(){
  const st=derive().stock,avg=derive().avg;let n=0,val=0;
  Object.keys(STK).forEach(id=>{if(!S._products.get(id))return;const d=r3(num(STK[id])-r3(st.get(id)||0));if(Math.abs(d)>0.0005){n++;val+=d*(avg.get(id)||0)}
    const b=$(`.stk-d[data-id="${id}"]`);if(b){b.textContent=(d>0?'+':'')+fq(d);b.className='num stk-d '+(d<0?'neg':d>0?'pos':'')}});
  if($('#stk-nd')){$('#stk-nd').textContent=n;$('#stk-nd').classList.toggle('neg',n>0)}
  if($('#stk-val'))$('#stk-val').innerHTML=money(val);
  if($('#stk-n'))$('#stk-n').textContent=n;
  if($('#stk-apply'))$('#stk-apply').disabled=!n;
};
async function stkApply(){
  stkSync();const st=derive().stock;const ch=Object.keys(STK).map(id=>{const p=S._products.get(id);if(!p)return null;const sys=r3(st.get(id)||0),cnt=num(STK[id]);return Math.abs(cnt-sys)>0.0005?{p,sys,cnt}:null}).filter(Boolean);
  if(!ch.length){toast(T('لا توجد فروقات — الكميات مطابقة للنظام','No differences — counts match the system'));return}
  if(!(await ask(T(`تعديل كميات ${ch.length} صنف لتطابق الجرد الفعلي؟`,`Adjust ${ch.length} items to match the physical count?`),T('تطبيق','Apply'))))return;
  let ok=0;
  for(const c of ch){if(await W(()=>db.collection('products').doc(c.p.id).update({opening:r3(num(c.p.opening)+(c.cnt-c.sys)),updatedAt:nowIso(),lastAdjust:{date:today(),from:c.sys,to:c.cnt,by:MYID||'',via:'stocktake'}}))){ok++;c.done=true}}
  if(!ok){toast(T('لم يتم تعديل أي صنف. تأكد من الاتصال وصلاحية التعديل ثم حاول مرة أخرى','Nothing was adjusted. Check your connection and permissions, then try again'),5000);render();return}
  if(ok===ch.length){STK={};try{await window.FB.fns.deleteDoc(stkRef())}catch(e){console.warn(e)}}
  else{const F=window.FB.fns;const del={};ch.forEach(c=>{if(c.done){delete STK[c.p.id];del[c.p.id]=F.deleteField()}});stkWrite({counts:del,who:del})}toast(T(`تمت تسوية ${ok} صنف ✓`,`${ok} items adjusted ✓`)+(ok<ch.length?T(` — تعذر ${ch.length-ok}`,` — ${ch.length-ok} failed`):''),4000);render();
}

const C_SALES='#2a78d6',C_PUR='#eb6834';
const AR_MON0=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const EN_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let AR_MON=AR_MON0;
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
const kfmt=v=>v>=1000?(r3(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'k'):String(r3(v));
function monthlyChart(){
  AR_MON=LANG==='en'?EN_MON:AR_MON0;const t=today();const months=[];
  const base=new Date(t.slice(0,7)+'-01T00:00:00');
  for(let i=5;i>=0;i--){const d=new Date(base);d.setMonth(d.getMonth()-i);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,lbl:AR_MON[d.getMonth()]})}
  const sum=(arr,k)=>arr.filter(x=>(x.date||'').startsWith(k)).reduce((a,x)=>a+num(x.total),0);
  months.forEach(m=>{m.s=sum(S.sales,m.key)-sum(S.sreturns,m.key);m.p=sum(S.purchases,m.key)-sum(S.preturns,m.key)});
  const W=Math.round(Math.min(1500,Math.max(300,(window.innerWidth>860?window.innerWidth-236-90:window.innerWidth-58)))),H=W<480?200:230,L=40,R=6,T=12,B=30,ih=H-T-B,iw=W-L-R;
  const mx=niceMax(Math.max(...months.map(m=>Math.max(m.s,m.p))));
  const y=v=>T+ih-(v/mx)*ih;const gw=iw/months.length;const bw=Math.min(22,gw*0.32);
  const bar=(x,v,c)=>{const h=Math.max(0,(v/mx)*ih);if(h<0.5)return '';const r=Math.min(4,h,bw/2);const y0=T+ih;return `<path d="M${x},${y0}V${y0-h+r}Q${x},${y0-h} ${x+r},${y0-h}H${x+bw-r}Q${x+bw},${y0-h} ${x+bw},${y0-h+r}V${y0}Z" fill="${c}"/>`};
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8eaee" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6b7385">${kfmt(v)}</text>`}
  months.forEach((m,i)=>{const cx=L+gw*i+gw/2;
    g+=bar(cx-bw-1,m.s,C_SALES)+bar(cx+1,m.p,C_PUR);
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11.5" fill="${m.key===t.slice(0,7)?'#1c2230':'#6b7385'}" font-weight="${m.key===t.slice(0,7)?600:400}">${m.lbl}</text>`;
    g+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ih+B}" fill="transparent" data-tip="${esc(`<b>${m.lbl} ${m.key.slice(0,4)}</b><div><i style="background:${C_SALES}"></i>المبيعات <span class="num">${fmt(m.s)}</span></div><div><i style="background:${C_PUR}"></i>المشتريات <span class="num">${fmt(m.p)}</span></div>`)}"/>`});
  const totS=months.reduce((a,m)=>a+m.s,0);
  return `<div class="card"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="margin:0;flex:1">المبيعات والمشتريات — آخر 6 أشهر</h3><div class="legend"><span><i style="background:${C_SALES}"></i>المبيعات</span><span><i style="background:${C_PUR}"></i>المشتريات</span></div></div>
  <div class="muted" style="font-size:12.5px;margin:2px 0 6px">مجموع المبيعات ${fmt(totS)} ${esc(ST().currency)} · شامل الضريبة</div>
  <div dir="ltr"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-height:260px" role="img" aria-label="المبيعات والمشتريات الشهرية">${g}</svg></div></div>`;
}
function hbars(title,sub,rows,color,valFmt,empty){
  const mx=Math.max(0,...rows.map(r=>r.v));
  return `<div class="card"><h3 style="margin-bottom:2px">${title}</h3><div class="muted" style="font-size:12.5px;margin-bottom:10px">${sub}</div>
  ${rows.length&&mx>0?rows.map(r=>`<div class="hb" data-tip="${esc(r.tip||`<b>${esc(r.label)}</b><div>${valFmt(r.v)}</div>`)}" ${r.act||''}><div class="hb-l" dir="auto" translate="no">${esc(r.label)}</div><div class="hb-t"><div class="hb-b" style="width:${Math.max(r.v/mx*100,r.v>0?1.5:0)}%;background:${r.color||color}"></div></div><div class="hb-v num">${valFmt(r.v)}</div></div>`).join(''):`<div class="empty" style="padding:16px">${empty}</div>`}</div>`;
}
function dashCharts(){
  const t=today(),m0=t.slice(0,7);
  // top products this month by value
  const pm=new Map();
  S.sales.filter(x=>(x.date||'').startsWith(m0)).forEach(x=>{const ratio=num(x.sub)>0?(num(x.sub)-num(x.discount))/num(x.sub):1;(x.lines||[]).forEach(l=>{const k=l.productId||'x:'+l.name;const e=pm.get(k)||{label:l.productId&&S._products.get(l.productId)?dn(S._products.get(l.productId)):l.name,v:0,q:0};e.v+=num(l.total)*ratio;e.q+=num(l.qty);pm.set(k,e)})});
  S.sreturns.filter(x=>(x.date||'').startsWith(m0)).forEach(x=>{const ratio=num(x.sub)>0?(num(x.sub)-num(x.discount))/num(x.sub):1;(x.lines||[]).forEach(l=>{const e=pm.get(l.productId||'x:'+l.name);if(e){e.v-=num(l.total)*ratio;e.q-=num(l.qty)}})});
  const top=[...pm.values()].filter(e=>e.v>0.0005).sort((a,b)=>b.v-a.v).slice(0,6).map(e=>({...e,tip:`<b>${esc(e.label)}</b><div>المبيعات <span class="num">${fmt(e.v)}</span></div><div>الكمية <span class="num">${fq(e.q)}</span></div>`}));
  // receivables aging
  const pd=derive().paid;const bk=[['لم تستحق بعد',0],['1–30 يوم',0],['31–60 يوم',0],['61–90 يوم',0],['أكثر من 90',0]];const cnt=[0,0,0,0,0];
  S.sales.forEach(x=>{const rem=num(x.total)-(pd.get(x.id)||0);if(rem<=0.0005)return;const due=effDue(x);const late=due&&due<t?daysBetween(due,t):0;const i=late<=0?0:late<=30?1:late<=60?2:late<=90?3:4;bk[i][1]+=rem;cnt[i]++});
  const AG=['#9ec5f4','#5598e7','#2a78d6','#1c5cab','#0d366b'];
  const aging=bk.map(([label,v],i)=>({label,v,color:AG[i],tip:`<b>${label}</b><div>المبلغ <span class="num">${fmt(v)}</span></div><div>${cnt[i]} فاتورة</div>`,act:i>0&&v>0?'data-act="showLate" style="cursor:pointer"':''}));
  return `${monthlyChart()}<div class="grid g2 f">${hbars('الأصناف الأكثر مبيعاً هذا الشهر','حسب قيمة المبيعات (قبل الضريبة)',top,C_SALES,fmt,'لا توجد مبيعات هذا الشهر')}${hbars('أعمار ديون العملاء','المبالغ غير المحصّلة حسب مدة التأخير',aging.some(a=>a.v>0)?aging:[],C_SALES,fmt,'لا توجد مبالغ مستحقة')}</div>`;
}

function docListView(kind){
  const k=KIND[kind];

const AGE_B=[['لم تستحق','Not due'],['1–30','1–30'],['31–60','31–60'],['61–90','61–90'],['+90','90+']];
function custAgeRows(){
  const d=derive(),t=today(),m=new Map(S.customers.map(c=>[c.id,{p:c,b:[0,0,0,0,0],other:0,bal:r3(d.cust.get(c.id)||0),oldest:0}]));
  S.sales.forEach(x=>{const r=m.get(x.partyId);if(!r)return;const rem=num(x.total)-(d.paid.get(x.id)||0);if(rem<=0.0005)return;const due=effDue(x);const late=due&&due<t?daysBetween(due,t):0;
    r.b[late<=0?0:late<=30?1:late<=60?2:late<=90?3:4]+=rem;if(late>r.oldest)r.oldest=late});
  for(const r of m.values()){r.b=r.b.map(r3);r.other=r3(r.bal-r.b.reduce((a,v)=>a+v,0))}
  return [...m.values()];
}
function custAgeFiltered(){
  const q=norm(Q.custbal);const f=Q.custbal_f||'due';

  if(q)arr=arr.filter(r=>norm(r.p.name).includes(q)||norm(r.p.nameEn).includes(q)||norm(r.p.phone).includes(q));
  return arr.sort((a,b)=>f==='credit'?a.bal-b.bal:(b.b[4]-a.b[4])||(b.bal-a.bal));
}

function periodRange(key){
  const t=today(),per=Q[key+'_p_f']||'month';let from='0000-01-01',to='9999-12-31';
  if(per==='month'){from=t.slice(0,7)+'-01';to=t}
  else if(per==='lmonth'){const d=new Date(t.slice(0,7)+'-01T00:00:00');d.setMonth(d.getMonth()-1);from=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;to=addDays(t.slice(0,7)+'-01',-1)}
  else if(per==='year'){from=t.slice(0,4)+'-01-01';to=t}
  return {per,from,to,inR:x=>(x.date||'')>=from&&(x.date||'')<=to};
}
const periodTabs=(key,per)=>`<div class="tabs">${[['month',T('هذا الشهر','This month')],['lmonth',T('الشهر الماضي','Last month')],['year',T('هذه السنة','This year')],['all',T('الكل','All')]].map(([v,t])=>`<button class="${per===v?'on':''}" data-act="filt" data-k="${key}_p" data-v="${v}">${t}</button>`).join('')}</div>`;

function voucherList(key,filterFn,title,addBtns,emptyTxt){

  const tot=arr.reduce((a,p)=>a+num(p.amount),0);
  const byAcc=new Map();arr.forEach(p=>{if(p.noCash)return;const k=payAcc(p);byAcc.set(k,(byAcc.get(k)||0)+num(p.amount))});

function accMoves(id){

    if(p.noCash||payAcc(p)!==id)continue;
    const who=p.partyType==='expense'?(p.category||T('مصروف','Expense'))+(p.partyName?' — '+p.partyName:''):(p.partyName||'');
    mv.push({p,[p.type==='in'?'in':'out']:a,desc:`${p.type==='in'?T('قبض','Receipt'):p.partyType==='expense'?T('مصروف','Expense'):T('صرف','Payment')}: ${who}${p.invoiceNo?' · '+p.invoiceNo:''}`});
  }
  mv.sort((x,y)=>((x.p.date||'')+(x.p.createdAt||'')).localeCompare((y.p.date||'')+(y.p.createdAt||'')));
  return mv;
}

async function saveTransfer(id){
  const from=$('#tr-from').value,to=$('#tr-to').value,amount=r3(num($('#tr-amt').value));
  if(!from||!to||from===to){toast(T('اختر حسابين مختلفين','Choose two different accounts'));return}
  if(amount<=0){toast(T('أدخل المبلغ','Enter the amount'));return}
  const body={type:'tr',fromAcc:from,toAcc:to,amount,date:$('#tr-date').value||today(),notes:$('#tr-notes').value.trim(),partyType:'transfer',partyName:'',updatedAt:nowIso()};
  const ok=await W(async()=>{
    if(id){const old=S._payments.get(id)||{};Object.assign(body,{no:old.no,createdAt:old.createdAt||nowIso(),createdBy:old.createdBy||''});await db.collection('payments').doc(id).set(body);return id}
    const r=await nextRef('payments','TR',x=>x.type==='tr');Object.assign(body,{no:r.no,createdAt:nowIso(),createdBy:MYID||''});await r.ref.set(body);return r.id;
  },T('تم الحفظ ✓','Saved ✓'));
  if(ok){closeModal();render()}
}

function payItem(p){
  if(p.type==='tr')return `<div class="item" data-act="openSub" data-type="pay" data-id="${p.id}"><div class="m"><div class="t" translate="no" dir="auto">${esc(accName(accById(p.fromAcc)))} ${T('←','→')} ${esc(accName(accById(p.toAcc)))}</div><div class="d"><span class="num">${payNo(p)}</span> · ${esc(p.date)}${p.notes?' · <span translate="no">'+esc(p.notes)+'</span>':''} <span class="badge b-pri">${T('تحويل','Transfer')}</span></div></div><div class="a">${money(p.amount)}</div></div>`;
  const exp=p.partyType==='expense';
  return `<div class="item" data-act="openSub" data-type="pay" data-id="${p.id}"><div class="m"><div class="t" translate="no" dir="auto">${esc(exp?(p.category||'مصروف'):(p.partyName||'—'))}</div><div class="d"><span class="num">${payNo(p)}</span> · ${esc(p.date)} · <span translate="no">${esc(accName(accById(payAcc(p))))}</span>${p.invoiceNo?` · <span class="num">${esc(p.invoiceNo)}</span>`:''} <span class="badge ${p.type==='in'?'b-green':exp?'b-amber':'b-red'}">${p.type==='in'?'قبض':exp?'مصروف':'صرف'}</span></div></div><div class="a ${p.type==='in'?'pos':'neg'}">${money(p.amount)}</div></div>`;
}

/* ---------- reports ---------- */
VIEWS.reports=()=>{
  const t=today();
  const per=Q.rep||'month';
  let from=Q.repFrom,to=Q.repTo;
  if(per==='month'){from=t.slice(0,7)+'-01';to=t}
  else if(per==='lmonth'){const d=new Date(t.slice(0,7)+'-01T00:00:00');d.setMonth(d.getMonth()-1);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');from=`${y}-${m}-01`;to=addDays(t.slice(0,7)+'-01',-1)}
  else if(per==='quarter'){const m=+t.slice(5,7);const qs=Math.floor((m-1)/3)*3+1;from=`${t.slice(0,4)}-${String(qs).padStart(2,'0')}-01`;to=t}
  else if(per==='year'){from=t.slice(0,4)+'-01-01';to=t}
  from=from||t.slice(0,7)+'-01';to=to||t;
  const inR=x=>x.date>=from&&x.date<=to;
  const d=derive();
  const sales=S.sales.filter(inR),pur=S.purchases.filter(inR),pays=S.payments.filter(inR);
  const sRet=S.sreturns.filter(inR),pRet=S.preturns.filter(inR);
  const sRT=sRet.reduce((a,x)=>a+num(x.total),0),pRT=pRet.reduce((a,x)=>a+num(x.total),0);
  const sT=sales.reduce((a,x)=>a+num(x.total),0)-sRT,sV=sales.reduce((a,x)=>a+num(x.vat),0)-sRet.reduce((a,x)=>a+num(x.vat),0),sN=sT-sV;
  const pT=pur.reduce((a,x)=>a+num(x.total),0)-pRT,pV=pur.reduce((a,x)=>a+num(x.vat),0)-pRet.reduce((a,x)=>a+num(x.vat),0);
  const exp=pays.filter(p=>p.partyType==='expense').reduce((a,p)=>a+num(p.amount),0);
  const col=pays.filter(p=>p.type==='in'&&p.partyType==='customer').reduce((a,p)=>a+num(p.amount),0);
  let cogs=0;const prod=new Map();
  for(const s of sales){const ratio=num(s.sub)>0?(num(s.sub)-num(s.discount))/num(s.sub):1;for(const l of s.lines||[]){const key=l.productId||('x:'+l.name);const e=prod.get(key)||{name:l.productId&&S._products.get(l.productId)?dn(S._products.get(l.productId)):l.name,qty:0,val:0,cost:0};const c=l.productId?num(l.qty)*(d.avg.get(l.productId)||0):0;e.qty+=num(l.qty);e.val+=num(l.total)*ratio;e.cost+=c;cogs+=c;prod.set(key,e)}}
  for(const s of sRet){const ratio=num(s.sub)>0?(num(s.sub)-num(s.discount))/num(s.sub):1;for(const l of s.lines||[]){const key=l.productId||('x:'+l.name);const e=prod.get(key);const c=l.productId?num(l.qty)*(d.avg.get(l.productId)||0):0;cogs-=c;if(e){e.qty-=num(l.qty);e.val-=num(l.total)*ratio;e.cost-=c}}}
  const gp=sN-cogs;
  const stockVal=S.products.reduce((a,p)=>a+Math.max(d.stock.get(p.id)||0,0)*(d.avg.get(p.id)||0),0);
  const recv=[...d.cust.values()].reduce((a,x)=>a+(x>0?x:0),0),payb=[...d.sup.values()].reduce((a,x)=>a+(x>0?x:0),0);
  const top=[...prod.values()].sort((a,b)=>b.val-a.val).slice(0,15);
  const debtors=S.customers.map(c=>[c,d.cust.get(c.id)||0]).filter(x=>x[1]>0.0005).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const expCat=new Map();pays.filter(p=>p.partyType==='expense').forEach(p=>expCat.set(p.category||'أخرى',(expCat.get(p.category||'أخرى')||0)+num(p.amount)));
  return `${loading()}<div class="head"><h1>التقارير</h1>${downloads?`<button class="btn" data-act="exportReport" data-from="${from}" data-to="${to}">⬇︎ Excel</button>`:''}</div>
  <div class="tabs">${[['month','هذا الشهر'],['lmonth','الشهر الماضي'],['quarter','هذا الربع'],['year','هذه السنة'],['custom','فترة مخصصة']].map(([v,tx])=>`<button class="${per===v?'on':''}" data-act="rep" data-v="${v}">${tx}</button>`).join('')}</div>
  ${per==='custom'?`<div class="grid g2" style="max-width:420px;margin-bottom:12px"><label>من<input type="date" id="rep-from" value="${from}"></label><label>إلى<input type="date" id="rep-to" value="${to}"></label></div>`:`<p class="muted" style="margin:0 0 12px;font-size:13px">من ${from} إلى ${to}</p>`}
  <div class="grid g4" style="margin-bottom:14px">
   <div class="stat"><div class="k">المبيعات (شامل الضريبة)</div><div class="v">${money(sT)}</div><div class="s">${sales.length} فاتورة · صافي ${fmt(sN)}${sRT?` · ${T('مرتجعات','returns')} ${fmt(sRT)}`:''}</div></div>
   <div class="stat"><div class="k">المشتريات (شامل الضريبة)</div><div class="v">${money(pT)}</div><div class="s">${pur.length} فاتورة${pRT?` · ${T('مرتجعات','returns')} ${fmt(pRT)}`:''}</div></div>
   <div class="stat"><div class="k">مجمل الربح (تقديري)</div><div class="v ${gp<0?'neg':''}">${money(gp)}</div><div class="s">صافي المبيعات − تكلفة البضاعة المباعة ${fmt(cogs)}</div></div>
   <div class="stat"><div class="k">صافي الربح (تقديري)</div><div class="v ${gp-exp<0?'neg':''}">${money(gp-exp)}</div><div class="s">بعد المصروفات ${fmt(exp)}</div></div>
   <div class="stat"><div class="k">ضريبة المخرجات (مبيعات)</div><div class="v">${money(sV)}</div></div>
   <div class="stat"><div class="k">ضريبة المدخلات (مشتريات)</div><div class="v">${money(pV)}</div></div>
   <div class="stat"><div class="k">صافي الضريبة المستحقة</div><div class="v ${sV-pV<0?'pos':''}">${money(sV-pV)}</div><div class="s">${sV-pV<0?'رصيد دائن لصالحك':'مستحقة لجهاز الضرائب'}</div></div>
   <div class="stat"><div class="k">المقبوضات في الفترة</div><div class="v">${money(col)}</div></div>
  </div>
  <div class="grid g3" style="margin-bottom:14px">
   <div class="stat"><div class="k">قيمة المخزون الحالية (بمتوسط التكلفة)</div><div class="v">${money(stockVal)}</div></div>
   <div class="stat"><div class="k">إجمالي المستحق على العملاء</div><div class="v">${money(recv)}</div></div>
   <div class="stat"><div class="k">إجمالي المستحق للموردين</div><div class="v">${money(payb)}</div></div>
  </div>
  <div class="grid g2 f">
   <div class="card"><h3>الأصناف الأكثر مبيعاً</h3><div class="tw"><table class="t"><tr><th>الصنف</th><th class="n">الكمية</th><th class="n">المبيعات</th><th class="n">الربح</th></tr>${top.map(e=>`<tr><td>${esc(e.name)}</td><td class="n num">${fq(e.qty)}</td><td class="n num">${fmt(e.val)}</td><td class="n num">${fmt(e.val-e.cost)}</td></tr>`).join('')||`<tr><td colspan=4 class="muted">لا توجد مبيعات</td></tr>`}</table></div></div>
   <div class="card"><h3>أعلى أرصدة العملاء</h3><div class="tw"><table class="t"><tr><th>العميل</th><th class="n">الرصيد</th></tr>${debtors.map(([c,b])=>`<tr data-act="openSub" data-type="party" data-col="customers" data-id="${c.id}" style="cursor:pointer"><td>${esc(c.name)}</td><td class="n num">${fmt(b)}</td></tr>`).join('')||`<tr><td colspan=2 class="muted">لا توجد أرصدة</td></tr>`}</table></div></div>
   <div class="card"><h3>المصروفات حسب البند</h3><table class="t">${[...expCat].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n num">${fmt(v)}</td></tr>`).join('')||`<tr><td class="muted">لا توجد مصروفات</td></tr>`}</table></div>
  </div>
  <p class="muted" style="font-size:12.5px">الأرباح تقديرية: تُحسب تكلفة البضاعة بمتوسط تكلفة الشراء لكل صنف.</p>`;
};

function statement(col,id){
  const isC=col==='customers';const p=S['_'+col].get(id)||{};
  const ev=[];
  (isC?S.sales:S.purchases).filter(x=>x.partyId===id).forEach(x=>ev.push({date:x.date,s:x.createdAt||'',desc:(isC?'فاتورة مبيعات ':'فاتورة مشتريات ')+docNo(isC?'sales':'purchases',x.no),dr:isC?num(x.total):0,cr:isC?0:num(x.total),open:{type:'doc',k:isC?'sales':'purchases',id:x.id}}));
  (isC?S.sreturns:S.preturns).filter(x=>x.partyId===id).forEach(x=>ev.push({date:x.date,s:x.createdAt||'',desc:(isC?'مرتجع مبيعات ':'مرتجع مشتريات ')+docNo(isC?'sreturns':'preturns',x.no)+(x.invoiceNo?' عن '+x.invoiceNo:''),dr:isC?0:num(x.total),cr:isC?num(x.total):0,open:{type:'doc',k:isC?'sreturns':'preturns',id:x.id}}));
  S.payments.filter(x=>x.partyId===id&&x.partyType===(isC?'customer':'supplier')).forEach(x=>{const a=num(x.amount);const d=(x.type==='in'?'سند قبض ':'سند صرف ')+payNo(x)+(x.invoiceNo?' عن '+x.invoiceNo:'')+(x.returnNo?' عن '+x.returnNo:'');
    ev.push({date:x.date,s:x.createdAt||'',desc:d,dr:isC?(x.type==='out'?a:0):(x.type==='out'?a:0),cr:isC?(x.type==='in'?a:0):(x.type==='in'?a:0),open:{type:'pay',id:x.id}})});
  ev.sort((a,b)=>(a.date+a.s).localeCompare(b.date+b.s));
  // customers: balance = dr - cr ; suppliers: balance = cr - dr
  let bal=num(p.opening);const rows=[{date:'',desc:'رصيد افتتاحي',dr:isC?Math.max(bal,0):Math.max(-bal,0),cr:isC?Math.max(-bal,0):Math.max(bal,0),bal}];
  for(const e of ev){bal+=isC?(e.dr-e.cr):(e.cr-e.dr);e.bal=bal;rows.push(e)}
  return rows;
}

    const short=[...need].filter(([pid,q])=>{const p=S._products.get(pid);return p&&!p.service&&q>(st.get(pid)||0)+0.0005});
    if(short.length&&!(await ask(`الكمية غير كافية في المخزون لـ: ${short.map(([pid])=>S._products.get(pid).name).join('، ')}. هل تريد الحفظ رغم ذلك؟`,'حفظ رغم ذلك'))) return;
  }
  let paidAmt=paidNow,adjustPays=null;
  const settle=isRet(kind)?((document.querySelector('input[name=e-settle]:checked')||{}).value||'credit'):'';
  if(kind==='sales'||kind==='purchases'){
    const tot=calc(JSON.parse(JSON.stringify(d))).total;
    const who=kind==='sales'?'العميل':'المورد';
    if(!E.id&&paidAmt>tot+0.0005){
      if(!(await ask(`المبلغ المدفوع (${fmt(paidAmt)}) أكبر من إجمالي الفاتورة (${fmt(tot)}). تعديل المدفوع ليساوي الإجمالي؟`,'تعديل إلى '+fmt(tot),false,'رجوع')))return;
      paidAmt=tot;
    }
    if(E.id){
      const linked=S.payments.filter(x=>x.invoiceId===E.id).sort((a,b)=>((b.date||'')+(b.createdAt||'')).localeCompare((a.date||'')+(a.createdAt||'')));
      const paid=r3(linked.reduce((a,x)=>a+num(x.amount),0));
      if(paid>tot+0.0005&&await ask(`الإجمالي الجديد (${fmt(tot)}) أقل من المبلغ المدفوع على الفاتورة (${fmt(paid)}). هل تريد تخفيض الدفعة ليساوي الإجمالي؟ إذا اخترت الإبقاء، يُحسب الفرق ${fmt(paid-tot)} رصيداً لصالح ${who}.`,'تخفيض الدفعة',false,'إبقاؤه رصيداً')){
        let ex=r3(paid-tot);adjustPays=[];
        for(const x of linked){if(ex<=0.0005)break;const a=num(x.amount);if(a<=ex+0.0005){adjustPays.push([x.id,0]);ex=r3(ex-a)}else{adjustPays.push([x.id,r3(a-ex)]);ex=0}}
      }
    }
  }
  saving=true;const btn=$('#e-save');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> جارِ الحفظ…'}
  const ok=await W(async()=>{
    let party=null;
    if(d.partyName){party=await ensureParty(k.party,d.partyName)}
    const c=calc(d);
    const body={date:d.date,due:d.due||'',partyId:party?party.id:'',partyName:party?party.name:(k.party==='suppliers'?'مورد نقدي':'عميل نقدي'),ref:d.ref,
      lines:d.lines.map(l=>({productId:l.productId||'',name:l.name,nameEn:l.nameEn||'',...(l.desc?{desc:l.desc}:{}),qty:r3(l.qty),price:r3(l.price),disc:r3(l.disc),discType:l.discType==='a'?'a':'p',...(l.noVat?{noVat:true}:{}),...((l.serials||[]).length?{serials:l.serials}:{}),...(num(l.warranty)>0?{warranty:num(l.warranty)}:{}),...(l.noStock&&l.productId?{noStock:true}:{}),total:r3(l.total)})),
      discount:c.discount,discType:d.discType==='p'?'p':'a',discPct:d.discType==='p'?Math.round(num(d.discPct)*1e6)/1e6:0,vatOn:!!d.vatOn,vatRate:d.vatRate,sub:c.sub,vatBase:c.vatBase,vat:c.vat,total:c.total,notes:d.notes||'',updatedAt:nowIso(),updatedBy:MYID||''};
    let id=E.id,no;
    if(isRet(kind)){body.invoiceId=d.invoiceId||'';body.invoiceNo=d.invoiceNo||'';body.due=''}
    if(isWO(kind)){Object.assign(body,{time:d.time||'',location:d.location||'',techs:d.techs||[]})}
    if(id){const old=S['_'+kind].get(id)||{};Object.assign(body,{no:old.no,createdAt:old.createdAt||nowIso(),createdBy:old.createdBy||'',status:old.status||(isWO(kind)?'new':'open'),quoteId:old.quoteId||''});if(old.poId)body.poId=old.poId;if(old.woId)body.woId=old.woId;if(isWO(kind))Object.assign(body,{result:old.result||'',invoiceId:old.invoiceId||'',apptId:old.apptId||''});if(!isRet(kind))body.invoiceId=old.invoiceId||'';else body.settle=old.settle||'credit';
      await db.collection(kind).doc(id).set(body);no=old.no;
      // keep linked vouchers consistent with the edited document
      if((old.partyId||'')!==(body.partyId||'')||(old.partyName||'')!==body.partyName){
        for(const x of S.payments.filter(x=>x.invoiceId===id||x.returnId===id))await db.collection('payments').doc(x.id).update({partyId:body.partyId,partyName:body.partyName,updatedAt:nowIso()});
        if(!isRet(kind)&&!isWO(kind)&&kind!=='quotes')for(const r of S[retKindOf(kind)].filter(r=>r.invoiceId===id))await db.collection(retKindOf(kind)).doc(r.id).update({partyId:body.partyId,partyName:body.partyName,updatedAt:nowIso()});
      }
      if(isRet(kind)){const rf=S.payments.filter(x=>x.returnId===id);if(rf.length===1&&Math.abs(num(rf[0].amount)-body.total)>0.0005){if(body.total>0.0005)await db.collection('payments').doc(rf[0].id).update({amount:r3(body.total),updatedAt:nowIso()})}}
      if(adjustPays)for(const [pid,amt] of adjustPays){if(amt<=0.0005)await db.collection('payments').doc(pid).delete();else await db.collection('payments').doc(pid).update({amount:amt,updatedAt:nowIso()})}
    } else {
      const r=await nextRef(kind,k.prefix);id=r.id;no=r.no;
      Object.assign(body,{no,createdAt:nowIso(),createdBy:MYID||'',status:isWO(kind)?(d.due?'scheduled':'new'):'open',quoteId:E.quoteId||''});
      if(isWO(kind)){body.apptId=E.apptId||'';body.result=''}
      if(kind==='sales'&&E.woId)body.woId=E.woId;
      if(kind==='purchases'&&E.poId)body.poId=E.poId;
      if(!isRet(kind))body.invoiceId='';else body.settle=settle;
      await r.ref.set(body);id=r.id;no=r.no;
      if(isRet(kind)&&settle==='refund'&&body.total>0)await createRefund(kind,id,no,body,method,accId);
      if(kind==='purchases'&&E.poId&&S._porders.get(E.poId)){await db.collection('porders').doc(E.poId).update({status:'received',invoiceId:id,invoiceNo:docNo('purchases',no),updatedAt:nowIso()})}
      if(E.quoteId&&!isWO(kind)){await db.collection('quotes').doc(E.quoteId).update({status:'converted',invoiceId:id,updatedAt:nowIso()})}
      if(kind==='sales'&&E.woId&&S._workorders.get(E.woId)){await db.collection('workorders').doc(E.woId).update({status:'invoiced',invoiceId:id,invoiceNo:docNo('sales',no),updatedAt:nowIso()})}
      if(paidAmt>0&&(kind==='sales'||kind==='purchases')){
        const t=kind==='sales'?'in':'out';
        const pr=await nextRef('payments',t==='in'?'RV':'PV',x=>x.type===t);
        await pr.ref.set({no:pr.no,type:t,date:d.date,partyType:kind==='sales'?'customer':'supplier',partyId:body.partyId,partyName:body.partyName,invoiceKind:kind,invoiceId:id,invoiceNo:docNo(kind,no),amount:r3(paidAmt),method,accountId:accId,notes:'',createdAt:nowIso(),createdBy:MYID||''});
      }
    }
    return {id,no};
  });
  saving=false;
  if(!ok){if(btn){btn.disabled=false;btn.innerHTML='💾 حفظ'}return}
  toast('تم الحفظ ✓');
  if(then==='new'){openEditor(kind,null,newDocData(kind));return}
  E=null;sub={type:'doc',k:kind,id:ok.id};
  if(route!==kind){route=kind;history.replaceState(null,'','#'+kind)}
  render();window.scrollTo(0,0);
}

const LIBS={zxing:'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',html2canvas:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'};

function lib(name){return libP[name]||(libP[name]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[name];s.onload=res;s.onerror=()=>{delete libP[name];rej(new Error('lib'))};document.head.appendChild(s)}))}
const TOUCH=matchMedia('(pointer:coarse)').matches;
async function saveFile(filename,data,opts={}){
  const blob=data instanceof Blob?data:new Blob([data]);
  const type=filename.endsWith('.pdf')?'application/pdf':filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':filename.endsWith('.json')?'application/json':'application/octet-stream';
  if((TOUCH||opts.share)&&navigator.canShare){
    try{const f=new File([blob],filename,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(new Blob([blob],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
// sections: html string or array (each starts on a new page). opts.blob=true returns Blob instead of saving.
async function htmlToPdf(sections,filename,opts={}){
  sections=Array.isArray(sections)?sections:[sections];
  toast(T('جارِ تجهيز الملف…','Preparing file…'),15000);
  try{await Promise.all([lib('html2canvas'),lib('jspdf')]);}catch(e){toast(T('تعذر تحميل مكتبة PDF، تحقق من الاتصال','Could not load PDF library, check connection'));return null}
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});
  const pw=210,ph=297;let first=true;const scale=opts.blob?1.6:2,q=opts.blob?0.8:0.92;
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    for(const html of sections){
      const host=document.createElement('div');host.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1';
      host.innerHTML=`<div class="paper" dir="${pdir()}" style="min-width:0;max-width:none;width:794px;min-height:1123px">${html}</div>`;
      document.body.appendChild(host);
      // html2canvas splits text at hyphens/spaces and misorders them in RTL: make number runs unbreakable
      $$('.num',host).forEach(el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))n.nodeValue=n.nodeValue.replace(/-/g,'‑').replace(/ /g,' ')});
      try{
        await Promise.all($$('img',host).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
        const canvas=await window.html2canvas(host.firstElementChild,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false});
        const pxPerPage=Math.floor(canvas.width*ph/pw);let y=0;
        while(y<canvas.height-4){
          const h=Math.min(pxPerPage,canvas.height-y);
          const c=document.createElement('canvas');c.width=canvas.width;c.height=h;c.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
          if(!first)pdf.addPage();first=false;
          pdf.addImage(c.toDataURL('image/jpeg',q),'JPEG',0,0,pw,h*pw/canvas.width);
          y+=h;
        }
      }finally{host.remove()}
    }
    $('#toast').classList.remove('on');
    const blob=pdf.output('blob');
    if(opts.blob)return blob;
    await saveFile(filename,blob);return blob;
  }catch(e){console.error(e);toast(T('تعذر إنشاء ملف PDF','Could not create PDF'));return null}
}

function watchMail(ref,to){

  try{un=F.onSnapshot(ref,x=>{if(done)return;const d=x.data&&x.data();const st=d&&d.delivery&&d.delivery.state;

function onLocalChanges(col,snap){

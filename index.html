<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام الإدارة والمحاسبة والمخزون</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
<meta name="theme-color" content="#13202e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المحاسبة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mute:#6b7385;--line:#e4e7ec;--pri:#0f766e;--pri-d:#0b5d57;--pri2:#e5f3f1;--red:#b4381a;--redbg:#fdeee8;--amber:#94600a;--amberbg:#fdf4dc;--green:#17803d;--greenbg:#e8f6ed;--side:#13202e;--r:12px}
*{box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:15px;letter-spacing:normal;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:normal}
a{color:var(--pri)}
#app{display:flex;min-height:100vh}
#side{width:236px;background:var(--side);color:#c9d3df;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 10px}
#side .brand{color:#fff;font-weight:700;font-size:16px;padding:4px 12px 16px;line-height:1.4}
#side .brand small{display:block;color:#8ea0b4;font-weight:400;font-size:12px}
#side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:inherit;text-decoration:none;margin-bottom:2px;font-size:14.5px}
#side a:hover{background:#1b2d3f}
#side a.on{background:#20384f;color:#fff}
#side a.navh{margin-top:2px}
#side a.navh.act{color:#fff}
#side .chev{transition:transform .15s;opacity:.7}
#side .chev.open{transform:rotate(-90deg)}
[dir=ltr] #side .chev{transform:rotate(180deg)}
[dir=ltr] #side .chev.open{transform:rotate(90deg)}
#side a.sub{padding-inline-start:26px;font-size:14px}
.acc-c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:box-shadow .12s,border-color .12s}
.acc-c:hover{border-color:#cfd5de;box-shadow:0 4px 14px rgba(20,30,45,.07)}
.acc-h{display:flex;align-items:center;gap:10px}
.acc-i{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-n{font-weight:600}
.acc-s{font-size:12px;color:var(--mute)}
.acc-b{font-size:22px;font-weight:700;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.acc-f{display:flex;gap:12px;font-size:12px;color:var(--mute)}
#side .ic{width:22px;text-align:center}
#scrim{display:none}
main{flex:1;min-width:0;padding:20px 28px 100px}
#bottom{display:none}
#topbar{display:none}
body.authmode #side,body.authmode #bottom,body.authmode #topbar,body.authmode #banner{display:none!important}
body.authmode main{margin:0 auto}
@media(max-width:860px){
 #side{position:fixed;right:0;top:0;z-index:60;display:none;box-shadow:-8px 0 30px rgba(0,0,0,.2);max-width:85vw}
 #side.open{display:block;animation:sidein .18s ease-out}
 @keyframes sidein{from{transform:translateX(100%)}to{transform:none}}
 [dir=ltr] #side{right:auto;left:0}
 [dir=ltr] #side.open{animation-name:sideinl}
 @keyframes sideinl{from{transform:translateX(-100%)}to{transform:none}}
 #scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
 main{padding:0 12px 96px}
 #topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 2px;margin-bottom:4px}
 #topbar b{font-size:16px}
 #bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
 #bottom a{flex:1;text-align:center;padding:7px 0 6px;font-size:11px;color:var(--mute);text-decoration:none}
 #bottom a span{display:block;font-size:19px;line-height:1.3}
 #bottom a.on{color:var(--pri);font-weight:600}
}
h1{font-size:22px;margin:6px 0 16px}
h2{font-size:19px;margin:0}
h3{font-size:16px;margin:0 0 10px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.head h1,.head h2{margin:0;flex:1;min-width:150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{border-color:#c8ced8}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.red{color:var(--red)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.grid>*,.qa>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.g2.f,.g3.f{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:4px}
input,select,textarea{border:1px solid #d5dae2;border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:15px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{min-height:auto;width:18px;height:18px;vertical-align:middle;flex-shrink:0;margin:0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:12.5px;color:var(--mute)}
.stat .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--mute);margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#fafbfc}
.item .m{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:12.5px;color:var(--mute);margin-top:2px}
.item .a{text-align:end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mute)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:600;background:#eef0f3;color:var(--mute)}
.b-green{background:var(--greenbg);color:var(--green)}
.b-red{background:var(--redbg);color:var(--red)}
.b-amber{background:var(--amberbg);color:var(--amber)}
.b-pri{background:var(--pri2);color:var(--pri)}
.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search input{flex:1;min-width:160px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--mute)}
.neg{color:var(--red)}
.pos{color:var(--green)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:start;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:end}
.tw{overflow-x:auto}
.tw table.t{min-width:560px}
table.t td.num,table.t td.n{white-space:nowrap}
.banner{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.banner.info{background:var(--pri2);color:var(--pri-d)}
/* editor lines */
.ln{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfcfd}
.ln .r1{display:flex;gap:8px;align-items:center}
.ln .r1 input{flex:1}
.ln .r2{display:grid;grid-template-columns:.9fr 1.2fr 1.5fr 1.1fr;gap:8px;margin-top:8px}
.ln .r2>label{min-width:0}
.ln .r2 input{min-width:0;width:100%}
.ln .r2 label{font-size:11.5px}
.ln .tot{min-height:40px;display:flex;align-items:center;font-weight:700;margin-top:4px}
.ln .stk{font-size:11.5px;color:var(--mute);margin-top:4px}
.totals{width:100%}
.totals td{padding:5px 0}
.totals td:last-child{text-align:end;font-weight:600}
.totals tr.big td{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px}
.sticky-act{position:sticky;bottom:70px;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);padding-top:14px}
@media(min-width:861px){.sticky-act{bottom:0}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,23,35,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal.open{display:flex}
#modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:861px){#modal{align-items:center}#modal .box{border-radius:16px}}
#modal h3{font-size:17px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1c2230;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;display:none;max-width:90vw;text-align:center}
#toast.on{display:block}
/* paper (printable) */
.paperwrap{overflow-x:auto;background:#e9ebef;border-radius:var(--r);padding:12px;container-type:inline-size}
.paper{font-family:'IBM Plex Sans Arabic',Arial,Tahoma,sans-serif;background:#fff;color:#111;width:100%;max-width:794px;margin:0 auto;padding:34px 34px 28px;font-size:13px;line-height:1.55}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #0f766e;padding-bottom:14px}
.paper .co b{font-size:18px;display:block}
.paper .co div{color:#444;font-size:12px}
.paper .logo{max-height:70px;max-width:170px}
.paper .ttl{text-align:center;margin:16px 0 12px}
.paper .ttl b{font-size:19px;display:block}
.paper .ttl span{font-size:12px;color:#555;letter-spacing:normal}
.paper .meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}
.paper .meta .bx{border:1px solid #ddd;border-radius:8px;padding:8px 12px;flex:1}
.paper .meta .bx div{display:flex;justify-content:space-between;gap:10px}
.paper .meta .bx div span:first-child{color:#666}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#0f766e;color:#fff;font-weight:600;padding:7px 8px;text-align:start;font-size:12px;line-height:1.3}
.paper td{padding:7px 8px;border-bottom:1px solid #e3e3e3}
.paper td.n,.paper th.n{text-align:end}
.paper .pe{color:#666;font-size:.86em;font-weight:400}
.paper th .pe{color:#d6efe9}
.paper .num{display:inline-block;direction:ltr;unicode-bidi:normal}
.paper td.num{display:table-cell}
.paper .sum{display:flex;justify-content:space-between;gap:20px;margin-top:14px}
.paper .sum .notes{flex:1;font-size:12px;color:#333;white-space:pre-wrap}
.paper .sum table{width:300px}
.paper .sum td{border:0;padding:4px 8px}
.paper .sum tr.big td{font-weight:700;font-size:15px;background:#e5f3f1;border-radius:4px}
.paper .foot{margin-top:28px;display:flex;justify-content:space-between;font-size:12px;color:#555}
.paper .foot div{border-top:1px solid #bbb;padding-top:6px;width:180px;text-align:center}
.paper .terms{margin-top:18px;font-size:11.5px;color:#555;white-space:pre-wrap;border-top:1px dashed #ccc;padding-top:8px}
.paper td.num,.paper td.n{white-space:nowrap}
@container (max-width:620px){
 .paperwrap .paper{padding:18px 14px;font-size:12px}
 .paperwrap .paper .meta,.paperwrap .paper .sum{flex-direction:column;gap:10px}
 .paperwrap .paper .sum table{width:100%}
 .paperwrap .paper th,.paperwrap .paper td{padding:6px 4px}
 .paperwrap .paper .ph{gap:10px}
}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute)}
.legend i,#tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:14px;background:#f0f2f5;border-radius:4px;overflow:hidden}
.hb-b{height:100%;border-radius:4px}
.hb-v{font-size:12.5px;color:var(--ink);min-width:58px;text-align:end}
.hb:hover .hb-t{background:#e6e9ee}
#tip{position:fixed;z-index:150;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:8px 12px;font-size:13px;display:none;min-width:150px;line-height:1.7}
#tip.on{display:block}
#tip div{display:flex;align-items:center;gap:6px}
#tip .num{margin-inline-start:auto;font-weight:600;padding-inline-start:10px}
.qa{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:16px}
.qa-c{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.qa-c:hover{border-color:#cfd5de;box-shadow:0 4px 14px rgba(20,30,45,.07);transform:translateY(-1px)}
.qa-c:active{transform:scale(.97)}
.qa-i{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa-t{font-size:13px;font-weight:600;text-align:center;line-height:1.3;overflow-wrap:anywhere}
@media(max-width:1100px){.qa{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:420px){.stat{padding:12px}.stat .v{font-size:18px}.head h1{font-size:20px}main{padding:0 10px 96px}}
@media(max-width:520px){.qa{gap:8px}.qa-c{padding:12px 4px 10px;border-radius:12px}.qa-i{width:42px;height:42px}.qa-t{font-size:12px}}
.dsc{display:flex;align-items:stretch;gap:0;margin-top:4px}
.dsc input{flex:1;min-width:0;border-start-end-radius:0;border-end-end-radius:0;margin:0}
.dsc-t{border:1px solid #d5dae2;border-inline-start:0;background:var(--pri2);color:var(--pri-d);font-weight:700;border-start-end-radius:9px;border-end-end-radius:9px;padding:0 8px;min-width:36px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.dsc-t:hover{background:#d3ebe7}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="scrim" data-act="closeSide"></div>
  <main>
    <div id="topbar"><button class="btn ghost" data-act="openSide" aria-label="القائمة">☰</button><b id="tb-title"></b><span style="width:44px"></span></div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
  <nav id="bottom"></nav>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="tip"></div>
<datalist id="dl-customers"></datalist>
<datalist id="dl-suppliers"></datalist>
<datalist id="dl-products"></datalist>

<script type="module" src="fb.js"></script>
<script>
"use strict";
/* ================= helpers ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r3=n=>Math.round((+n||0)*1000)/1000;
const num=v=>{const x=parseFloat(String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,''));return isFinite(x)?x:0};
const fmt=n=>r3(n).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const fq=n=>{const v=r3(n);return Number.isInteger(v)?String(v):v.toLocaleString('en-US',{maximumFractionDigits:3})};
const money=n=>`<span class="num">${fmt(n)}</span>`;
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fdate=s=>{s=String(s||'');const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:s};
const norm=s=>String(s??'').trim().toLowerCase();
const nowIso=()=>new Date().toISOString();

let db=null,RO=false,ADMIN=false,MYID=null,ROLE=null,AUTHU=null,NODB=false;const MCP=true,downloads=true;
const COLS=['customers','suppliers','products','quotes','sales','purchases','payments','sreturns','preturns','appointments'];
const S={settings:{},ready:new Set(),settingsReady:false,err:null,slow:false};
COLS.forEach(c=>{S[c]=[];S['_'+c]=new Map()});
let ver=0;
let route=(location.hash||'').slice(1)||'dashboard';
let sub=null;       // detail page: {type,id}
let E=null;         // active editor
const Q={};         // search text per list
S.activity=[];

const ST=()=>Object.assign({overdueDays:30,vatRate:5,currency:'ر.ع.',quoteDays:15,dueDays:0,company:'',lowStock:true},S.settings||{});

/* ================= i18n (UI) ================= */
let LANG=(()=>{try{return localStorage.getItem('lang')||'ar'}catch(_){return 'ar'}})();
const EN={
'الرئيسية':'Home','فواتير المبيعات':'Sales invoices','عروض الأسعار':'Quotations','فواتير المشتريات':'Purchase invoices','السندات والمصروفات':'Vouchers & expenses','العملاء':'Customers','الموردين':'Suppliers','الأصناف والمخزون':'Items & stock','التقارير':'Reports','الإعدادات والاستيراد':'Settings & import','المبيعات':'Sales','المخزون':'Stock','المزيد':'More',
'نظام الإدارة والمحاسبة':'Accounting & Inventory','المبيعات · المشتريات · المخزون':'Sales · Purchases · Stock','لوحة التحكم':'Dashboard',
'عرض سعر':'Quotation','فاتورة مبيعات':'Sales invoice','فاتورة مشتريات':'Purchase invoice','فاتورة':'Invoice','فاتورة ضريبية':'Tax invoice',

// Arabic-letter-aware phrase replacement (longest first)
const EN_KEYS=Object.keys(EN).sort((a,b)=>b.length-a.length);
const AR_RE=/[؀-ۿ]/;
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const EN_PHRASES=EN_KEYS.filter(k=>AR_RE.test(k)&&(/\s/.test(k.trim())||k.length>=7||k==='ر.ع.')).map(k=>[k.trim(),new RegExp('(?<![\\u0600-\\u06FF])'+escRe(k.trim())+'(?![\\u0600-\\u06FF])','g'),EN[k]]);
function trText(s){
  if(!s||!AR_RE.test(s))return s;
  const t=s.trim();
  if(EN[t]!==undefined) return s.replace(t,EN[t]);
  let out=s;
  for(const [k,re,v] of EN_PHRASES){if(out.includes(k))out=out.replace(re,v)}
  // single words only if every remaining Arabic word is known (avoid touching names)
  const words=out.match(/[؀-ۿ]+/g);
  if(words&&words.every(w=>EN[w]!==undefined)) out=out.replace(/[؀-ۿ]+/g,w=>EN[w]);
  return out;
}
function trTree(root){
  if(LANG!=='en'||!root)return;
  if(root.nodeType===3){if(!skipNode(root.parentElement))root.nodeValue=trText(root.nodeValue);return}
  if(root.nodeType!==1||skipNode(root))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1?(skipNode(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP):NodeFilter.FILTER_ACCEPT});
  const nodes=[];let n;while((n=w.nextNode()))nodes.push(n);
  for(const t of nodes){const v=trText(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v}
  const els=[root,...root.querySelectorAll('[placeholder],[title],[aria-label],option')];
  for(const el of els){if(el.closest&&el.closest('[translate=no],.paper'))continue;for(const a of ['placeholder','title','aria-label']){const v=el.getAttribute&&el.getAttribute(a);if(v&&AR_RE.test(v))el.setAttribute(a,trText(v))}}
}
function skipNode(el){return !!(el&&el.closest&&el.closest('[translate=no],.paper,script,style,textarea,datalist'))}
let trObs=null;
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='en'?'ltr':'rtl';
  if(trObs){trObs.disconnect();trObs=null}
  if(LANG==='en'){
    trObs=new MutationObserver(ms=>{for(const m of ms){for(const n of m.addedNodes)trTree(n)}});
    trObs.observe(document.body,{childList:true,subtree:true});
    trTree(document.body);
  }
}

let D=null,Dver=-1;
function derive(){
  if(Dver===ver&&D) return D;
  const stock=new Map(),cq=new Map(),cv=new Map(),avg=new Map(),paid=new Map(),cust=new Map(),sup=new Map();
  for(const p of S.products){const o=num(p.opening);stock.set(p.id,o);cq.set(p.id,o);cv.set(p.id,o*num(p.cost));}
  for(const d of S.purchases){for(const l of d.lines||[]){if(!l.productId||!stock.has(l.productId))continue;const q=num(l.qty);stock.set(l.productId,stock.get(l.productId)+q);cq.set(l.productId,cq.get(l.productId)+q);cv.set(l.productId,cv.get(l.productId)+num(l.total));}}
  for(const d of S.sales){for(const l of d.lines||[]){if(!l.productId||!stock.has(l.productId))continue;stock.set(l.productId,stock.get(l.productId)-num(l.qty));}}
  for(const d of S.sreturns){for(const l of d.lines||[]){if(!l.productId||!stock.has(l.productId))continue;stock.set(l.productId,stock.get(l.productId)+num(l.qty));}}
  for(const d of S.preturns){for(const l of d.lines||[]){if(!l.productId||!stock.has(l.productId))continue;const q=num(l.qty);stock.set(l.productId,stock.get(l.productId)-q);cq.set(l.productId,cq.get(l.productId)-q);cv.set(l.productId,cv.get(l.productId)-num(l.total));}}
  for(const p of S.products){const q=cq.get(p.id);avg.set(p.id,q>0?cv.get(p.id)/q:num(p.cost));}
  for(const c of S.customers) cust.set(c.id,num(c.opening));
  for(const s of S.suppliers) sup.set(s.id,num(s.opening));
  for(const d of S.sales) if(d.partyId&&cust.has(d.partyId)) cust.set(d.partyId,cust.get(d.partyId)+num(d.total));
  for(const d of S.purchases) if(d.partyId&&sup.has(d.partyId)) sup.set(d.partyId,sup.get(d.partyId)+num(d.total));
  const ret=new Map(),cash=new Map(),retDoc=new Map();
  for(const d of S.sreturns){retDoc.set(d.id,d);if(d.partyId&&cust.has(d.partyId))cust.set(d.partyId,cust.get(d.partyId)-num(d.total));if(d.invoiceId){ret.set(d.invoiceId,(ret.get(d.invoiceId)||0)+num(d.total));paid.set(d.invoiceId,(paid.get(d.invoiceId)||0)+num(d.total))}}
  for(const d of S.preturns){retDoc.set(d.id,d);if(d.partyId&&sup.has(d.partyId))sup.set(d.partyId,sup.get(d.partyId)-num(d.total));if(d.invoiceId){ret.set(d.invoiceId,(ret.get(d.invoiceId)||0)+num(d.total));paid.set(d.invoiceId,(paid.get(d.invoiceId)||0)+num(d.total))}}
  const acc=new Map(ACCS().map(x=>[x.id,num(x.opening)]));
  const addAcc=(id,v)=>{if(!id)return;acc.set(id,(acc.get(id)||0)+v)};
  for(const p of S.payments){
    const a=num(p.amount);
    if(p.type==='tr'){addAcc(p.fromAcc,-a);addAcc(p.toAcc,a);continue}
    addAcc(payAcc(p),p.type==='in'?a:-a);
    if(p.invoiceId){paid.set(p.invoiceId,(paid.get(p.invoiceId)||0)+a);cash.set(p.invoiceId,(cash.get(p.invoiceId)||0)+a)}
    if(p.returnId){const r=retDoc.get(p.returnId);if(r&&r.invoiceId){paid.set(r.invoiceId,(paid.get(r.invoiceId)||0)-a);cash.set(r.invoiceId,(cash.get(r.invoiceId)||0)-a)}}
    if(p.partyType==='customer'&&cust.has(p.partyId)) cust.set(p.partyId,cust.get(p.partyId)+(p.type==='in'?-a:a));
    if(p.partyType==='supplier'&&sup.has(p.partyId)) sup.set(p.partyId,sup.get(p.partyId)+(p.type==='out'?-a:a));
  }
  D={stock,avg,paid,cust,sup,acc,ret,cash};Dver=ver;return D;
}

const discLabel=l=>num(l.disc)?(l.discType==='a'?fmt(l.disc):fq(l.disc)+'%'):'';
function calc(d){
  let sub=0;
  for(const l of d.lines||[]){l.total=lineTotal(l);sub+=l.total;}
  sub=r3(sub);const discount=d.discType==='p'?r3(sub*num(d.discPct)/100):r3(num(d.discount));const taxable=r3(sub-discount);
  const vat=d.vatOn?r3(taxable*num(d.vatRate)/100):0;
  return {sub,discount,taxable,vat,total:r3(taxable+vat)};
}

function invStatus(kind,d){
  if(isRet(kind)){const rf=S.payments.some(p=>p.returnId===d.id);return rf?['تم رد المبلغ','b-green']:['خصم من الرصيد','b-pri']}
  if(kind==='quotes'){
    if(d.status==='converted') return ['تم تحويله لفاتورة','b-green'];
    if(d.status==='rejected') return ['مرفوض','b-red'];
    if(d.due&&d.due<today()) return ['منتهي الصلاحية','b-amber'];
    return ['مفتوح','b-pri'];
  }
  const p=derive().paid.get(d.id)||0,t=num(d.total);
  if(t<=0.0005||p>=t-0.0005) return ['مدفوعة','b-green'];
  const ed=kind==='sales'?effDue(d):d.due;

  if(p>0) return ['مدفوعة جزئياً','b-amber'];
  return ['غير مدفوعة','b-red'];
}

function icsAppt(id){
  const a=S._appointments.get(id);if(!a)return;
  const st=(a.date+'T'+(a.time||'09:00')).replace(/[-:]/g,'')+'00';
  const end=new Date(`${a.date}T${a.time||'09:00'}:00`);end.setMinutes(end.getMinutes()+(num(a.duration)||60));
  const p=n=>String(n).padStart(2,'0');const en=`${end.getFullYear()}${p(end.getMonth()+1)}${p(end.getDate())}T${p(end.getHours())}${p(end.getMinutes())}00`;
  const e=s=>String(s||'').replace(/[\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const ty=apType(a);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SmartClick//Accounting//AR','BEGIN:VEVENT',`UID:${id}@smartclick`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART:${st}`,`DTEND:${en}`,`SUMMARY:${e(T(ty[0],ty[1])+' — '+a.customerName)}`,`LOCATION:${e(a.location)}`,`DESCRIPTION:${e(a.notes)}`,'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  saveFile(`${a.date}-${(a.customerName||'appointment').replace(/[\\/:*?"<>|]/g,'')}.ics`,new Blob([ics],{type:'text/calendar'}));
}

const C_SALES='#2a78d6',C_PUR='#eb6834';
const AR_MON0=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const EN_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let AR_MON=AR_MON0;
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
const kfmt=v=>v>=1000?(r3(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'k'):String(r3(v));
function monthlyChart(){
  AR_MON=LANG==='en'?EN_MON:AR_MON0;const t=today();const months=[];
  const base=new Date(t.slice(0,7)+'-01T00:00:00');
  for(let i=5;i>=0;i--){const d=new Date(base);d.setMonth(d.getMonth()-i);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,lbl:AR_MON[d.getMonth()]})}
  const sum=(arr,k)=>arr.filter(x=>(x.date||'').startsWith(k)).reduce((a,x)=>a+num(x.total),0);
  months.forEach(m=>{m.s=sum(S.sales,m.key)-sum(S.sreturns,m.key);m.p=sum(S.purchases,m.key)-sum(S.preturns,m.key)});
  const W=Math.round(Math.min(1500,Math.max(300,(window.innerWidth>860?window.innerWidth-236-90:window.innerWidth-58)))),H=W<480?200:230,L=40,R=6,T=12,B=30,ih=H-T-B,iw=W-L-R;
  const mx=niceMax(Math.max(...months.map(m=>Math.max(m.s,m.p))));
  const y=v=>T+ih-(v/mx)*ih;const gw=iw/months.length;const bw=Math.min(22,gw*0.32);
  const bar=(x,v,c)=>{const h=Math.max(0,(v/mx)*ih);if(h<0.5)return '';const r=Math.min(4,h,bw/2);const y0=T+ih;return `<path d="M${x},${y0}V${y0-h+r}Q${x},${y0-h} ${x+r},${y0-h}H${x+bw-r}Q${x+bw},${y0-h} ${x+bw},${y0-h+r}V${y0}Z" fill="${c}"/>`};
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8eaee" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6b7385">${kfmt(v)}</text>`}
  months.forEach((m,i)=>{const cx=L+gw*i+gw/2;
    g+=bar(cx-bw-1,m.s,C_SALES)+bar(cx+1,m.p,C_PUR);
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11.5" fill="${m.key===t.slice(0,7)?'#1c2230':'#6b7385'}" font-weight="${m.key===t.slice(0,7)?600:400}">${m.lbl}</text>`;
    g+=`<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ih+B}" fill="transparent" data-tip="${esc(`<b>${m.lbl} ${m.key.slice(0,4)}</b><div><i style="background:${C_SALES}"></i>المبيعات <span class="num">${fmt(m.s)}</span></div><div><i style="background:${C_PUR}"></i>المشتريات <span class="num">${fmt(m.p)}</span></div>`)}"/>`});
  const totS=months.reduce((a,m)=>a+m.s,0);
  return `<div class="card"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="margin:0;flex:1">المبيعات والمشتريات — آخر 6 أشهر</h3><div class="legend"><span><i style="background:${C_SALES}"></i>المبيعات</span><span><i style="background:${C_PUR}"></i>المشتريات</span></div></div>
  <div class="muted" style="font-size:12.5px;margin:2px 0 6px">مجموع المبيعات ${fmt(totS)} ${esc(ST().currency)} · شامل الضريبة</div>
  <div dir="ltr"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-height:260px" role="img" aria-label="المبيعات والمشتريات الشهرية">${g}</svg></div></div>`;
}
function hbars(title,sub,rows,color,valFmt,empty){

function dashCharts(){
  const t=today(),m0=t.slice(0,7);

  const pm=new Map();
  S.sales.filter(x=>(x.date||'').startsWith(m0)).forEach(x=>{const ratio=num(x.sub)>0?(num(x.sub)-num(x.discount))/num(x.sub):1;(x.lines||[]).forEach(l=>{const k=l.productId||'x:'+l.name;const e=pm.get(k)||{label:l.productId&&S._products.get(l.productId)?dn(S._products.get(l.productId)):l.name,v:0,q:0};e.v+=num(l.total)*ratio;e.q+=num(l.qty);pm.set(k,e)})});
  S.sreturns.filter(x=>(x.date||'').startsWith(m0)).forEach(x=>{const ratio=num(x.sub)>0?(num(x.sub)-num(x.discount))/num(x.sub):1;(x.lines||[]).forEach(l=>{const e=pm.get(l.productId||'x:'+l.name);if(e){e.v-=num(l.total)*ratio;e.q-=num(l.qty)}})});
  const top=[...pm.values()].filter(e=>e.v>0.0005).sort((a,b)=>b.v-a.v).slice(0,6).map(e=>({...e,tip:`<b>${esc(e.label)}</b><div>المبيعات <span class="num">${fmt(e.v)}</span></div><div>الكمية <span class="num">${fq(e.q)}</span></div>`}));
  // receivables aging
  const pd=derive().paid;const bk=[['لم تستحق بعد',0],['1–30 يوم',0],['31–60 يوم',0],['61–90 يوم',0],['أكثر من 90',0]];const cnt=[0,0,0,0,0];
  S.sales.forEach(x=>{const rem=num(x.total)-(pd.get(x.id)||0);if(rem<=0.0005)return;const due=effDue(x);const late=due&&due<t?daysBetween(due,t):0;const i=late<=0?0:late<=30?1:late<=60?2:late<=90?3:4;bk[i][1]+=rem;cnt[i]++});
  const AG=['#9ec5f4','#5598e7','#2a78d6','#1c5cab','#0d366b'];

  return `${monthlyChart()}<div class="grid g2 f">${hbars('الأصناف الأكثر مبيعاً هذا الشهر','حسب قيمة المبيعات (قبل الضريبة)',top,C_SALES,fmt,'لا توجد مبيعات هذا الشهر')}${hbars('أعمار ديون العملاء','المبالغ غير المحصّلة حسب مدة التأخير',aging.some(a=>a.v>0)?aging:[],C_SALES,fmt,'لا توجد مبالغ مستحقة')}</div>`;
}

function periodRange(key){
  const t=today(),per=Q[key+'_p_f']||'month';let from='0000-01-01',to='9999-12-31';
  if(per==='month'){from=t.slice(0,7)+'-01';to=t}
  else if(per==='lmonth'){const d=new Date(t.slice(0,7)+'-01T00:00:00');d.setMonth(d.getMonth()-1);from=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;to=addDays(t.slice(0,7)+'-01',-1)}
  else if(per==='year'){from=t.slice(0,4)+'-01-01';to=t}
  return {per,from,to,inR:x=>(x.date||'')>=from&&(x.date||'')<=to};
}

function accMoves(id){
  const mv=[];
  for(const p of S.payments){
    const a=num(p.amount);

VIEWS.reports=()=>{
  const t=today();
  const per=Q.rep||'month';
  let from=Q.repFrom,to=Q.repTo;
  if(per==='month'){from=t.slice(0,7)+'-01';to=t}
  else if(per==='lmonth'){const d=new Date(t.slice(0,7)+'-01T00:00:00');d.setMonth(d.getMonth()-1);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');from=`${y}-${m}-01`;to=addDays(t.slice(0,7)+'-01',-1)}
  else if(per==='quarter'){const m=+t.slice(5,7);const qs=Math.floor((m-1)/3)*3+1;from=`${t.slice(0,4)}-${String(qs).padStart(2,'0')}-01`;to=t}
  else if(per==='year'){from=t.slice(0,4)+'-01-01';to=t}
  from=from||t.slice(0,7)+'-01';to=to||t;
  const inR=x=>x.date>=from&&x.date<=to;
  const d=derive();
  const sales=S.sales.filter(inR),pur=S.purchases.filter(inR),pays=S.payments.filter(inR);
  const sRet=S.sreturns.filter(inR),pRet=S.preturns.filter(inR);
  const sRT=sRet.reduce((a,x)=>a+num(x.total),0),pRT=pRet.reduce((a,x)=>a+num(x.total),0);
  const sT=sales.reduce((a,x)=>a+num(x.total),0)-sRT,sV=sales.reduce((a,x)=>a+num(x.vat),0)-sRet.reduce((a,x)=>a+num(x.vat),0),sN=sT-sV;
  const pT=pur.reduce((a,x)=>a+num(x.total),0)-pRT,pV=pur.reduce((a,x)=>a+num(x.vat),0)-pRet.reduce((a,x)=>a+num(x.vat),0);
  const exp=pays.filter(p=>p.partyType==='expense').reduce((a,p)=>a+num(p.amount),0);
  const col=pays.filter(p=>p.type==='in').reduce((a,p)=>a+num(p.amount),0);
  let cogs=0;const prod=new Map();
  for(const s of sales){const ratio=num(s.sub)>0?(num(s.sub)-num(s.discount))/num(s.sub):1;for(const l of s.lines||[]){const key=l.productId||('x:'+l.name);const e=prod.get(key)||{name:l.productId&&S._products.get(l.productId)?dn(S._products.get(l.productId)):l.name,qty:0,val:0,cost:0};const c=l.productId?num(l.qty)*(d.avg.get(l.productId)||0):0;e.qty+=num(l.qty);e.val+=num(l.total)*ratio;e.cost+=c;cogs+=c;prod.set(key,e)}}
  for(const s of sRet){const ratio=num(s.sub)>0?(num(s.sub)-num(s.discount))/num(s.sub):1;for(const l of s.lines||[]){const key=l.productId||('x:'+l.name);const e=prod.get(key);const c=l.productId?num(l.qty)*(d.avg.get(l.productId)||0):0;cogs-=c;if(e){e.qty-=num(l.qty);e.val-=num(l.total)*ratio;e.cost-=c}}}

   <div class="stat"><div class="k">المبيعات (شامل الضريبة)</div><div class="v">${money(sT)}</div><div class="s">${sales.length} فاتورة · صافي ${fmt(sN)}${sRT?` · ${T('مرتجعات','returns')} ${fmt(sRT)}`:''}</div></div>

   <div class="stat"><div class="k">المقبوضات في الفترة</div><div class="v">${money(col)}</div></div>

  <div class="grid g3" style="margin-bottom:14px">

function waLink(phone,text){

const PLANG=()=>ST().printLang||'both';

function statement(col,id){
  const isC=col==='customers';const p=S['_'+col].get(id)||{};
  const ev=[];
  (isC?S.sales:S.purchases).filter(x=>x.partyId===id).forEach(x=>ev.push({date:x.date,s:x.createdAt||'',desc:(isC?'فاتورة مبيعات ':'فاتورة مشتريات ')+docNo(isC?'sales':'purchases',x.no),dr:isC?num(x.total):0,cr:isC?0:num(x.total),open:{type:'doc',k:isC?'sales':'purchases',id:x.id}}));
  (isC?S.sreturns:S.preturns).filter(x=>x.partyId===id).forEach(x=>ev.push({date:x.date,s:x.createdAt||'',desc:(isC?'مرتجع مبيعات ':'مرتجع مشتريات ')+docNo(isC?'sreturns':'preturns',x.no)+(x.invoiceNo?' عن '+x.invoiceNo:''),dr:isC?0:num(x.total),cr:isC?num(x.total):0,open:{type:'doc',k:isC?'sreturns':'preturns',id:x.id}}));
  S.payments.filter(x=>x.partyId===id&&x.partyType===(isC?'customer':'supplier')).forEach(x=>{const a=num(x.amount);const d=(x.type==='in'?'سند قبض ':'سند صرف ')+payNo(x)+(x.invoiceNo?' عن '+x.invoiceNo:'')+(x.returnNo?' عن '+x.returnNo:'');
    ev.push({date:x.date,s:x.createdAt||'',desc:d,dr:isC?(x.type==='out'?a:0):(x.type==='out'?a:0),cr:isC?(x.type==='in'?a:0):(x.type==='in'?a:0),open:{type:'pay',id:x.id}})});
  ev.sort((a,b)=>(a.date+a.s).localeCompare(b.date+b.s));
  // customers: balance = dr - cr ; suppliers: balance = cr - dr
  let bal=num(p.opening);const rows=[{date:'',desc:'رصيد افتتاحي',dr:isC&&bal>0?bal:0,cr:!isC&&bal>0?bal:0,bal}];
  for(const e of ev){bal+=isC?(e.dr-e.cr):(e.cr-e.dr);e.bal=bal;rows.push(e)}
  return rows;
}

    <div class="r2"><label>الكمية<input class="l-qty" inputmode="decimal" value="${esc(l.qty)}"></label><label>السعر<input class="l-price" inputmode="decimal" value="${esc(l.price)}" placeholder="0.000"></label><label>${T('الخصم','Discount')}<span class="dsc"><input class="l-disc" inputmode="decimal" value="${num(l.disc)||''}" placeholder="0"><button type="button" class="dsc-t" data-act="discType" data-t="${l.discType==='a'?'a':'p'}" title="${T('تبديل بين النسبة والمبلغ','Switch percent / amount')}">${l.discType==='a'?esc(curSym()):'%'}</button></span></label><label>الإجمالي<div class="tot num l-tot"></div></label></div>

function readLines(){
  return $$('#e-lines .ln').map(el=>({nameEn:(el.dataset.pid&&S._products.get(el.dataset.pid)&&S._products.get(el.dataset.pid).nameEn)||'',productId:el.dataset.pid||'',name:$('.l-name',el).value.trim(),qty:num($('.l-qty',el).value),price:num($('.l-price',el).value),disc:num($('.l-disc',el).value),discType:$('.dsc-t',el).dataset.t==='a'?'a':'p'}));
}
function onLineProduct(inp){

  if(p){el.dataset.pid=p.id;inp.value=p.name;const pr=$('.l-price',el);pr.value=fmt(KIND[E.kind].party==='suppliers'?(num(p.cost)||''):p.price).replace(/,/g,'');

    if(el===$$('#e-lines .ln').pop()){E.d.lines=readLines();E.d.lines.push({productId:'',name:'',qty:1,price:'',disc:0});renderLines();const n=$$('#e-lines .l-name').pop();if(n&&window.innerWidth>860)n.focus();}
  } else {el.dataset.pid='';$('.stk',el).textContent=inp.value.trim()?'سطر حر (لا يؤثر على المخزون)':'';}
  updTotals();

function readEditor(){
  const d=E.d;
  d.partyName=$('#e-party').value.trim();d.date=$('#e-date').value||today();d.due=$('#e-due').value;d.ref=$('#e-ref').value.trim();
  d.notes=$('#e-notes').value;d.discType=$('#e-disc-t')&&$('#e-disc-t').dataset.t==='p'?'p':'a';if(d.discType==='p'){d.discPct=num($('#e-discount').value);d.discount=0}else{d.discount=num($('#e-discount').value);d.discPct=0}d.vatOn=$('#e-vat').checked;d.vatRate=num($('#e-vatRate').value);
  d.lines=readLines();
  if($('#e-inv')){d.invoiceId=$('#e-inv').value;const inv=d.invoiceId&&S['_'+KIND[E.kind].ret].get(d.invoiceId);d.invoiceNo=inv?docNo(KIND[E.kind].ret,inv.no):''}
  return d;
}
function returnableLines(invKind,inv,exceptId){
  const done=returnedQty(inv.id,exceptId);
  return (inv.lines||[]).map(l=>{const key=l.productId||'n:'+l.name;const used=Math.min(done.get(key)||0,num(l.qty));done.set(key,Math.max(0,(done.get(key)||0)-num(l.qty)));return {productId:l.productId||'',name:l.name,nameEn:l.nameEn||'',qty:r3(num(l.qty)-used),price:num(l.price),disc:num(l.disc),discType:l.discType||'p'}}).filter(l=>l.qty>0.0005);
}
function fillFromInvoice(invId){
  if(!E||!invId)return;const k=KIND[E.kind];const inv=S['_'+k.ret].get(invId);if(!inv)return;
  readEditor();
  const lines=returnableLines(k.ret,inv,E.id);
  if(!lines.length){toast(T('كل أصناف هذه الفاتورة مُرتجعة مسبقاً','All items of this invoice were already returned'),3500);return}
  Object.assign(E.d,{lines,vatOn:inv.vatOn,vatRate:inv.vatRate,discount:0,partyName:inv.partyName,partyId:inv.partyId,invoiceId:invId,invoiceNo:docNo(k.ret,inv.no)});
  $('#e-party').value=inv.partyName;renderLines();updTotals();partyInfo();
}
function updTotals(){
  if(!E)return;const d=readEditor();
  const ls=$$('#e-lines .ln');
  d.lines.forEach((l,i)=>{$('.l-tot',ls[i]).textContent=fmt(lineTotal(l))});
  const dp=$('#e-disc-t');if(dp)$('#t-disc').textContent=dp.dataset.t==='p'?'= '+fmt(calc({...d,lines:d.lines.filter(l=>l.name)}).discount):'';
  const c=calc({...d,lines:d.lines.filter(l=>l.name)});
  $('#t-sub').textContent=fmt(c.sub);$('#t-vat').textContent=fmt(c.vat);$('#t-total').textContent=fmt(c.total);
  E.total=c.total;
}
async function nextRef(col,prefix,filter){
  let max=0;for(const x of S[col]) if(!filter||filter(x)) max=Math.max(max,num(x.no));
  let n=max+1;
  for(let i=0;i<30;i++){const id=prefix+'-'+String(n).padStart(5,'0');const ref=db.collection(col).doc(id);let g;try{g=await ref.get()}catch(e){if(!navigator.onLine)return {ref,no:n,id};throw e}if(!g.exists)return {ref,no:n,id};n++;}
  throw new Error('numbering');
}
async function ensureParty(col,name){
  if(!name) return null;
  const ex=partyByName(col,name);if(ex) return ex;
  const ref=db.collection(col).doc();const data={name,phone:'',opening:0,createdAt:nowIso(),createdBy:MYID||''};
  await ref.set(data);return {id:ref.id,...data};
}
let saving=false;
async function saveDoc(then){
  if(saving||!E)return;
  const kind=E.kind;const k=KIND[kind];const d=readEditor();
  d.lines=d.lines.filter(l=>l.name);
  if(!d.lines.length){toast('أضف صنفاً واحداً على الأقل');return}
  if(d.lines.some(l=>l.qty<=0)){toast('الكمية يجب أن تكون أكبر من صفر');return}
  const paidNow=$('#e-paid')?num($('#e-paid').value):0;
  const method=$('#e-method')?$('#e-method').value:'cash';const accId=$('#e-acc')?$('#e-acc').value:defAcc(method);
  // returns: qty vs original invoice
  if(isRet(kind)&&d.invoiceId){
    const inv=S['_'+k.ret].get(d.invoiceId);
    if(inv){const avail=new Map();returnableLines(k.ret,inv,E.id).forEach(l=>{const key=l.productId||'n:'+l.name;avail.set(key,(avail.get(key)||0)+l.qty)});
      const over=d.lines.filter(l=>{const key=l.productId||'n:'+l.name;return l.qty>(avail.get(key)||0)+0.0005});
      if(over.length&&!(await ask(T(`الكمية المرتجعة أكبر من المتبقي في الفاتورة الأصلية لـ: ${over.map(l=>l.name).join('، ')}. هل تريد الحفظ رغم ذلك؟`,`Returned quantity exceeds what remains on the original invoice for: ${over.map(l=>l.name).join(', ')}. Save anyway?`),T('حفظ رغم ذلك','Save anyway'))))return;}
  }
  // stock warning
  if(kind==='sales'||kind==='preturns'){
    const st=derive().stock;const need=new Map();
    d.lines.forEach(l=>{if(l.productId)need.set(l.productId,(need.get(l.productId)||0)+l.qty)});
    if(E.id){const old=S['_'+kind].get(E.id);(old&&old.lines||[]).forEach(l=>{if(l.productId&&need.has(l.productId))need.set(l.productId,need.get(l.productId)-num(l.qty))})}
    const short=[...need].filter(([pid,q])=>{const p=S._products.get(pid);return p&&!p.service&&q>(st.get(pid)||0)+0.0005});
    if(short.length&&!(await ask(`الكمية غير كافية في المخزون لـ: ${short.map(([pid])=>S._products.get(pid).name).join('، ')}. هل تريد الحفظ رغم ذلك؟`,'حفظ رغم ذلك'))) return;
  }
  let paidAmt=paidNow,adjustPays=null;
  const settle=isRet(kind)?((document.querySelector('input[name=e-settle]:checked')||{}).value||'credit'):'';
  if(kind==='sales'||kind==='purchases'){
    const tot=calc(JSON.parse(JSON.stringify(d))).total;
    const who=kind==='sales'?'العميل':'المورد';
    if(!E.id&&paidAmt>tot+0.0005){
      if(!(await ask(`المبلغ المدفوع (${fmt(paidAmt)}) أكبر من إجمالي الفاتورة (${fmt(tot)}). تعديل المدفوع ليساوي الإجمالي؟`,'تعديل إلى '+fmt(tot),false,'رجوع')))return;
      paidAmt=tot;
    }
    if(E.id){
      const linked=S.payments.filter(x=>x.invoiceId===E.id).sort((a,b)=>((b.date||'')+(b.createdAt||'')).localeCompare((a.date||'')+(a.createdAt||'')));
      const paid=r3(linked.reduce((a,x)=>a+num(x.amount),0));
      if(paid>tot+0.0005&&await ask(`الإجمالي الجديد (${fmt(tot)}) أقل من المبلغ المدفوع على الفاتورة (${fmt(paid)}). هل تريد تخفيض الدفعة ليساوي الإجمالي؟ إذا اخترت الإبقاء، يُحسب الفرق ${fmt(paid-tot)} رصيداً لصالح ${who}.`,'تخفيض الدفعة',false,'إبقاؤه رصيداً')){
        let ex=r3(paid-tot);adjustPays=[];
        for(const x of linked){if(ex<=0.0005)break;const a=num(x.amount);if(a<=ex+0.0005){adjustPays.push([x.id,0]);ex=r3(ex-a)}else{adjustPays.push([x.id,r3(a-ex)]);ex=0}}
      }
    }
  }
  saving=true;const btn=$('#e-save');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> جارِ الحفظ…'}
  const ok=await W(async()=>{
    let party=null;
    if(d.partyName){party=await ensureParty(k.party,d.partyName)}
    const c=calc(d);
    const body={date:d.date,due:d.due||'',partyId:party?party.id:'',partyName:party?party.name:(kind==='purchases'?'مورد نقدي':'عميل نقدي'),ref:d.ref,
      lines:d.lines.map(l=>({productId:l.productId||'',name:l.name,nameEn:l.nameEn||'',qty:r3(l.qty),price:r3(l.price),disc:r3(l.disc),discType:l.discType==='a'?'a':'p',total:r3(l.total)})),
      discount:c.discount,discType:d.discType==='p'?'p':'a',discPct:d.discType==='p'?r3(d.discPct):0,vatOn:!!d.vatOn,vatRate:d.vatRate,sub:c.sub,vat:c.vat,total:c.total,notes:d.notes||'',updatedAt:nowIso(),updatedBy:MYID||''};
    let id=E.id,no;
    if(isRet(kind)){body.invoiceId=d.invoiceId||'';body.invoiceNo=d.invoiceNo||'';body.due=''}
    if(id){const old=S['_'+kind].get(id)||{};Object.assign(body,{no:old.no,createdAt:old.createdAt||nowIso(),createdBy:old.createdBy||'',status:old.status||'open',quoteId:old.quoteId||''});if(!isRet(kind))body.invoiceId=old.invoiceId||'';else body.settle=old.settle||'credit';
      await db.collection(kind).doc(id).set(body);no=old.no;
      if(adjustPays)for(const [pid,amt] of adjustPays){if(amt<=0.0005)await db.collection('payments').doc(pid).delete();else await db.collection('payments').doc(pid).update({amount:amt,updatedAt:nowIso()})}
    } else {
      const r=await nextRef(kind,k.prefix);id=r.id;no=r.no;
      Object.assign(body,{no,createdAt:nowIso(),createdBy:MYID||'',status:'open',quoteId:E.quoteId||''});
      if(!isRet(kind))body.invoiceId='';else body.settle=settle;
      await r.ref.set(body);
      if(isRet(kind)&&settle==='refund'&&body.total>0)await createRefund(kind,id,no,body,method,accId);
      if(E.quoteId){await db.collection('quotes').doc(E.quoteId).update({status:'converted',invoiceId:id,updatedAt:nowIso()})}
      if(paidAmt>0&&(kind==='sales'||kind==='purchases')){
        const t=kind==='sales'?'in':'out';
        const pr=await nextRef('payments',t==='in'?'RV':'PV',x=>x.type===t);
        await pr.ref.set({no:pr.no,type:t,date:d.date,partyType:kind==='sales'?'customer':'supplier',partyId:body.partyId,partyName:body.partyName,invoiceKind:kind,invoiceId:id,invoiceNo:docNo(kind,no),amount:r3(paidAmt),method,accountId:accId,notes:'',createdAt:nowIso(),createdBy:MYID||''});
      }
    }
    return {id,no};
  });
  saving=false;
  if(!ok){if(btn){btn.disabled=false;btn.innerHTML='💾 حفظ'}return}
  toast('تم الحفظ ✓');
  if(then==='new'){openEditor(kind,null,newDocData(kind));return}
  E=null;sub={type:'doc',k:kind,id:ok.id};
  if(route!==kind){route=kind;history.replaceState(null,'','#'+kind)}
  render();window.scrollTo(0,0);
}

async function createRefund(kind,id,no,body,method,accId){
  const t=kind==='sreturns'?'out':'in';
  const pr=await nextRef('payments',t==='in'?'RV':'PV',x=>x.type===t);
  await pr.ref.set({no:pr.no,type:t,date:body.date,partyType:kind==='sreturns'?'customer':'supplier',partyId:body.partyId,partyName:body.partyName,returnKind:kind,returnId:id,returnNo:docNo(kind,no),invoiceId:'',invoiceNo:'',amount:r3(body.total),method:method||'cash',accountId:accId||defAcc(method),notes:kind==='sreturns'?'رد مبلغ مرتجع':'استرداد مرتجع مشتريات',createdAt:nowIso(),createdBy:MYID||''});
}

   <p class="muted" style="font-size:13.5px">${esc(d.partyName)} · <span class="num">${docNo(kind,d.no)}</span> · ${money(d.total)}</p>
   <div class="grid g2"><label>${T('طريقة الدفع','Method')}<select id="rf-method" onchange="document.getElementById('rf-acc').value=defAcc(this.value)">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>${T('الخزينة / الحساب','Cash box / account')}<select id="rf-acc">${accOptions(defAcc('cash'))}</select></label></div>

const LIBS={html2canvas:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'};
const libP={};
function lib(name){return libP[name]||(libP[name]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[name];s.onload=res;s.onerror=()=>{delete libP[name];rej(new Error('lib'))};document.head.appendChild(s)}))}
const TOUCH=matchMedia('(pointer:coarse)').matches;
async function saveFile(filename,data,opts={}){
  const blob=data instanceof Blob?data:new Blob([data]);
  const type=filename.endsWith('.pdf')?'application/pdf':filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':filename.endsWith('.json')?'application/json':'application/octet-stream';
  if((TOUCH||opts.share)&&navigator.canShare){
    try{const f=new File([blob],filename,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(new Blob([blob],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
// sections: html string or array (each starts on a new page). opts.blob=true returns Blob instead of saving.
async function htmlToPdf(sections,filename,opts={}){
  sections=Array.isArray(sections)?sections:[sections];
  toast(T('جارِ تجهيز الملف…','Preparing file…'),15000);
  try{await Promise.all([lib('html2canvas'),lib('jspdf')]);}catch(e){toast(T('تعذر تحميل مكتبة PDF، تحقق من الاتصال','Could not load PDF library, check connection'));return null}
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});
  const pw=210,ph=297;let first=true;const scale=opts.blob?1.6:2,q=opts.blob?0.8:0.92;
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    for(const html of sections){
      const host=document.createElement('div');host.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1';
      host.innerHTML=`<div class="paper" dir="${pdir()}" style="min-width:0;max-width:none;width:794px;min-height:1123px">${html}</div>`;
      document.body.appendChild(host);
      // html2canvas splits text at hyphens/spaces and misorders them in RTL: make number runs unbreakable
      $$('.num',host).forEach(el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))n.nodeValue=n.nodeValue.replace(/-/g,'‑').replace(/ /g,' ')});
      try{
        await Promise.all($$('img',host).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
        const canvas=await window.html2canvas(host.firstElementChild,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false});
        const pxPerPage=Math.floor(canvas.width*ph/pw);let y=0;
        while(y<canvas.height-4){
          const h=Math.min(pxPerPage,canvas.height-y);
          const c=document.createElement('canvas');c.width=canvas.width;c.height=h;c.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
          if(!first)pdf.addPage();first=false;
          pdf.addImage(c.toDataURL('image/jpeg',q),'JPEG',0,0,pw,h*pw/canvas.width);
          y+=h;
        }
      }finally{host.remove()}
    }
    $('#toast').classList.remove('on');
    const blob=pdf.output('blob');
    if(opts.blob)return blob;
    await saveFile(filename,blob);return blob;
  }catch(e){console.error(e);toast(T('تعذر إنشاء ملف PDF','Could not create PDF'));return null}
}

/* ---------- customer portal ---------- */
function newToken(){const a=new Uint8Array(18);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const portalBase=()=>location.href.split('#')[0].split('?')[0].replace(/index\.html$/,'').replace(/\/?$/,'/')+'portal.html';
async function portalLink(cid){
  const c=S._customers.get(cid);if(!c)return '';
  let t=c.portalToken;
  if(!t){if(RO)return '';t=newToken();await db.collection('customers').doc(cid).update({portalToken:t});c.portalToken=t}
  await syncPortal(cid,t);
  return `${portalBase()}?t=${t}`;
}
function buildPortal(cid,token){
  const c=S._customers.get(cid);if(!c)return null;const s=ST();const d=derive();
  PORTAL_RENDER=true;
  try{
    const sales=S.sales.filter(x=>x.partyId===cid).sort((a,b)=>(b.date+String(b.no).padStart(8,'0')).localeCompare(a.date+String(a.no).padStart(8,'0')));
    const unpaid=sales.filter(x=>num(x.total)-(d.paid.get(x.id)||0)>0.0005);
    const keep=[...new Set([...unpaid,...sales.slice(0,120)])];
    const stat=x=>{const [ar,cls]=invStatus('sales',x);return {ar,en:EN[ar]||ar,cls}};
    const invoices=keep.map(x=>({id:x.id,no:docNo('sales',x.no),date:x.date,due:effDue(x)||'',total:num(x.total),paid:r3(d.paid.get(x.id)||0),st:stat(x),html:paperDoc('sales',x)}));
    const quotes=S.quotes.filter(x=>x.partyId===cid&&x.status!=='converted'&&x.status!=='rejected').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30)
      .map(x=>{const [ar,cls]=invStatus('quotes',x);return {id:x.id,no:docNo('quotes',x.no),date:x.date,due:x.due||'',total:num(x.total),st:{ar,en:EN[ar]||ar,cls},html:paperDoc('quotes',x)}});
    const pays=S.payments.filter(p=>p.partyType==='customer'&&p.partyId===cid).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map(p=>({id:p.id,no:payNo(p),date:p.date,amount:num(p.amount),type:p.type,inv:p.invoiceNo||'',html:paperPay(p)}));
    return {v:1,token,customer:{name:c.name,nameEn:c.nameEn||'',phone:c.phone||''},balance:r3(d.cust.get(cid)||0),currency:s.currency,printLang:PLANG(),
      company:{name:s.company||'',nameEn:s.companyEn||'',phone:s.phone||'',email:s.email||'',address:s.address||'',vatNo:s.vatNo||'',bank:s.bank||''},logo:s.logo||'',
      invoices,quotes,payments:pays,statement:statementHtml('customers',cid),counts:{invoices:sales.length,shown:keep.length},updatedAt:nowIso()};
  }finally{PORTAL_RENDER=false}
}
async function syncPortal(cid,token){
  const c=S._customers.get(cid);token=token||(c&&c.portalToken);if(!token||RO)return;
  const data=buildPortal(cid,token);if(!data)return;
  let json=JSON.stringify(data);
  while(json.length>900000&&data.invoices.length>10){data.invoices=data.invoices.slice(0,Math.floor(data.invoices.length*0.7));json=JSON.stringify(data)}
  await db.doc('portal/'+token).set(data);
}
const portalQ=new Set();let portalT=null;
function queuePortalSync(cid){if(!cid||RO)return;portalQ.add(cid);clearTimeout(portalT);portalT=setTimeout(async()=>{const ids=[...portalQ];portalQ.clear();for(const id of ids){const c=S._customers.get(id);if(c&&c.portalToken){try{await syncPortal(id)}catch(e){console.error('portal sync',e)}}}},1500)}
function onLocalChanges(col,snap){
  if(!snap.metadata.hasPendingWrites||RO)return;
  for(const ch of snap.docChanges()){
    if(!ch.doc.metadata.hasPendingWrites&&ch.type!=='removed')continue;
    const x=ch.doc.data()||{};
    if(col==='customers')queuePortalSync(ch.doc.id);
    else if(col==='sales'||col==='quotes'||col==='sreturns')queuePortalSync(x.partyId);
    else if(col==='appointments')continue;
    else if(col==='payments'&&x.partyType==='customer')queuePortalSync(x.partyId);
  }
}

async function resolveAccess(){
  const u=AUTHU;if(!u){authScreen('login');return}
  authScreen('wait');
  const g=async p=>{try{return await db.doc(p).get()}catch(e){return {exists:false,data:()=>undefined,err:e}}};
  const owner=await g('meta/owner');
  if(owner.exists&&owner.data().uid===u.uid){ROLE='admin'}
  else{
    const st=await g('staff/'+u.uid);
    if(st.exists)ROLE=st.data().role||'viewer';
    else{
      const inv=await g('invites/'+(u.email||'').toLowerCase());
      if(inv.exists){
        if(!u.emailVerified){authScreen('verify');return}
        try{await db.doc('staff/'+u.uid).set({email:(u.email||'').toLowerCase(),role:inv.data().role,createdAt:nowIso()});await db.doc('invites/'+(u.email||'').toLowerCase()).delete().catch(()=>{});ROLE=inv.data().role}
        catch(e){console.error(e);authScreen('denied',T('تعذر تفعيل الحساب','Could not activate the account'));return}
      }else if(!owner.exists&&!owner.err){authScreen('claim');return}
      else{authScreen('denied');return}
    }
  }
  MYID=u.uid;RO=ROLE==='viewer';ADMIN=ROLE==='admin';
  document.body.classList.remove('authmode');
  startData();
}
let dataStarted=false;
function startData(){
  if(dataStarted){render();return}dataStarted=true;
  const slowT=setTimeout(()=>{S.slow=true;renderShell()},10000);
  const onErr=c=>e=>{console.error(c,e);S.err=e&&e.code==='permission-denied'?T('لا تملك صلاحية قراءة البيانات.','You don\'t have permission to read the data.'):T('انقطع الاتصال بقاعدة البيانات. أعد فتح الصفحة.','Lost connection to the database. Reopen the page.');renderShell()};
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(x=>({...x.data(),id:x.id}));S['_'+c]=new Map(S[c].map(x=>[x.id,x]));
      if(!snap.metadata.fromCache){S.ready.add(c);if(allReady()){clearTimeout(slowT);S.slow=false}}

      schedule();
    },e=>{if(c==='sreturns'||c==='preturns'||c==='appointments'){console.warn(c,e);S.ready.add(c);S.rulesOld=true;renderShell();schedule();return}onErr(c)(e)});
  });
  db.doc('meta/settings').onSnapshot(s=>{const local=s.metadata&&s.metadata.hasPendingWrites;S.settings=s.exists?s.data():{};S.settingsReady=true;schedule();if(local&&!RO){S.customers.filter(c=>c.portalToken).forEach(c=>queuePortalSync(c.id))}},onErr('settings'));

  db.collection('staff').onSnapshot(s=>{STF.staff=s.docs.map(x=>({...x.data(),id:x.id}));if((route==='settings'||route==='appointments')&&!E)schedule()},()=>{});
  if(ADMIN){
    db.collection('invites').onSnapshot(s=>{STF.invites=s.docs.map(x=>({...x.data(),id:x.id}));if(route==='settings'&&!sub&&!E)schedule()},()=>{});

  }

}

async function importJson(e){
  const f=e.target.files[0];if(!f)return;const prog=$('#json-prog');
  let data;try{data=JSON.parse(await f.text())}catch(_){toast(T('ملف غير صالح','Invalid file'));return}
  const cols=data.collections||{};const total=COLS.reduce((a,c)=>a+((cols[c]||[]).length),0);
  if(!total&&!data.settings){toast(T('الملف لا يحتوي بيانات','The file has no data'));return}
  if(!(await ask(T(`استيراد ${total} سجل؟ السجلات بنفس المعرّف ستُستبدل.`,`Import ${total} records? Records with the same ID will be replaced.`),T('استيراد','Import'))))return;
  const F=window.FB.fns;let done=0;
  try{
    if(data.settings&&Object.keys(data.settings).length)await db.doc('meta/settings').set(data.settings);

      for(let i=0;i<rows.length;i+=400){

  }catch(err){console.error(err);prog.innerHTML=`<div class="banner">${T('توقف الاستيراد بعد','Import stopped after')} ${done}: ${esc(err.code||err.message)}</div>`}
}

async function readSheetFile(f){
  const buf=await f.arrayBuffer();
  if(/\.csv$/i.test(f.name)){
    let text=new TextDecoder('utf-8').decode(buf);
    if((text.match(/�/g)||[]).length>3){try{text=new TextDecoder('windows-1256').decode(buf)}catch(_){}}
    text=text.replace(/^﻿/,'');
    return window.XLSX.read(text,{type:'string',raw:true});
  }
  return window.XLSX.read(buf,{type:'array'});
}

function impMap(){const m={};$$('.imp-map').forEach(s=>m[s.dataset.k]=+s.value);return m}
function impRecords(col,m){
  const numF=['price','cost','opening','minQty'];const H=IMP.H;
  const at=(r,names)=>{for(const n of names){const i=H.indexOf(n);if(i>=0&&String(r[i]??'').trim())return String(r[i]).trim()}return ''};
  const recs=[];const seen=new Set();let dup=0,empty=0;
  for(const r of IMP.rows){
    const o={};for(const [k] of IMPORT_FIELDS[col]){if(m[k]>=0){const v=r[m[k]];o[k]=numF.includes(k)?r3(num(v)):String(v??'').trim()}}
    if(col!=='products'&&!o.phone)o.phone=at(r,['mobile','phone2','phone','mobilenumber']);
    if(!o.name&&col!=='products'){const fn=[at(r,['firstname','الاسمالأول']),at(r,['lastname','اسمالعائلة'])].filter(Boolean).join(' ');o.name=at(r,['businessname'])||fn||o.phone||(o.code?('#'+o.code):'')}
    if(!o.name){empty++;continue}
    const key=o.code?'c:'+norm(o.code):'n:'+norm(o.name)+'|'+norm(o.phone);
    if(seen.has(key)){dup++;continue}seen.add(key);recs.push(o);
  }
  return {recs,dup,empty};
}
async function importGo(col){
  if(!IMP)return;const m=impMap();if(m.name<0&&col==='products'){toast('اختر عمود الاسم');return}

  const upd=$('#imp-upd').checked;const btn=$('#imp-go');btn.disabled=true;
  const {recs}=impRecords(col,m);
  const byCode=new Map(),byName=new Map();S[col].forEach(x=>{if(x.code)byCode.set(norm(x.code),x);byName.set(norm(x.name),x)});
  let created=0,updated=0,skipped=0,failed=0,done=0;const prog=$('#imp-prog');const F=window.FB.fns;
  const ops=[];
  for(const o of recs){
    const fromOld=o.code&&byName.get(norm(o.code));
    const ex=(o.code&&byCode.get(norm(o.code)))||(fromOld&&fromOld.importedFrom==='excel'&&!fromOld.code?fromOld:null)||((!o.code||col==='products')?byName.get(norm(o.name)):null);
    if(ex){if(upd){const body={...ex,...o,updatedAt:nowIso()};delete body.id;if(ex===fromOld){if(ex.vatNo===o.code)body.vatNo=o.vatNo||'';if(String(ex.opening)===String(o.code))body.opening=o.opening||0}ops.push([ex.id,body]);updated++}else skipped++}
    else{const body={...o,createdAt:nowIso(),createdBy:MYID||'',importedFrom:'excel'};if(col==='products'&&!body.unit)body.unit='';ops.push([null,body]);created++}
  }
  try{
    for(let i=0;i<ops.length;i+=400){
      const b=F.writeBatch(FB.fs);
      for(const [id,body] of ops.slice(i,i+400)){const ref=id?F.doc(FB.fs,col,id):F.doc(F.collection(FB.fs,col));b.set(ref,body)}
      await b.commit();done+=Math.min(400,ops.length-i);prog.innerHTML=`<span class="spin"></span> ${done} / ${ops.length}`;
    }
  }catch(e){console.error(e);failed=ops.length-done;created=Math.max(0,created-failed)}
  writeLog('import',col,'',null,null,{label:`${T('استيراد من Excel','Excel import')}: ${created} ${T('جديد','new')} · ${updated} ${T('محدّث','updated')}`});
  prog.innerHTML=`<div class="banner info">تم: ${created} جديد · ${updated} محدّث${skipped?` · ${skipped} موجود مسبقاً`:''}${failed?` · <b>${failed} فشل</b>`:''}</div>`;
  btn.classList.add('hide');IMP=null;
}

/* ---------- activity log ---------- */
const LOG_SKIP=new Set(['activity','portal']);
const LOG_FIELDS={total:'الإجمالي',amount:'المبلغ',date:'التاريخ',partyName:'الطرف',status:'الحالة',discount:'الخصم',price:'سعر البيع',cost:'التكلفة',opening:'الرصيد / الكمية الافتتاحية',name:'الاسم',phone:'الهاتف',email:'البريد',role:'الصلاحية',method:'طريقة الدفع',accountId:'الحساب',category:'البند',time:'الوقت',type:'النوع',minQty:'الحد الأدنى',vatRate:'نسبة الضريبة',company:'اسم الشركة',portalToken:'رابط العميل'};
function cachedDoc(col,id){if(col==='meta'&&id==='settings')return S.settings;const m=S['_'+col];return m?m.get(id):undefined}
function logLabel(col,id,d){
  d=d||{};
  if(KIND[col])return `${docNo(col,d.no)} · ${d.partyName||''}`;
  if(col==='payments')return `${payNo(d)} · ${d.type==='tr'?accName(accById(d.fromAcc))+' → '+accName(accById(d.toAcc)):(d.partyType==='expense'?(d.category||''):(d.partyName||''))}${d.amount!=null?' · '+fmt(d.amount):''}`;
  if(col==='appointments')return `${d.customerName||''} · ${d.date||''} ${d.time||''}`;
  if(col==='meta')return id==='settings'?'الإعدادات':id;
  if(col==='staff')return d.email||id;
  if(col==='invites')return id;
  return d.name||id;
}
function diffFields(a,b){
  const out=[];if(!a||!b)return out;
  for(const f of Object.keys(LOG_FIELDS)){if(!(f in b))continue;const x=a[f],y=b[f];if(JSON.stringify(x??'')!==JSON.stringify(y??''))out.push({f,from:x==null?'':String(x).slice(0,80),to:y==null?'':String(y).slice(0,80)})}
  if(b.lines&&a.lines&&JSON.stringify(a.lines)!==JSON.stringify(b.lines))out.push({f:'lines',from:'',to:''});
  if(b.accounts&&JSON.stringify(a.accounts||[])!==JSON.stringify(b.accounts))out.push({f:'accounts',from:'',to:''});
  if('logo' in b&&(a.logo||'')!==(b.logo||''))out.push({f:'logo',from:'',to:''});
  return out.slice(0,12);
}
function writeLog(action,col,id,before,after,extra){
  if(!MYID||!db||LOG_SKIP.has(col))return;
  const changes=action==='update'?diffFields(before,after):[];
  if(action==='update'&&!changes.length&&!extra)return; // nothing meaningful (e.g. lastBackupAt, lastEmail)
  const data={at:nowIso(),by:MYID,byEmail:(AUTHU&&AUTHU.email||'').toLowerCase(),action,col,docId:id||'',label:String(extra&&extra.label||logLabel(col,id,after||before)).slice(0,200),changes};
  try{const F=window.FB.fns;const p=F.setDoc(F.doc(F.collection(FB.fs,'activity')),data);p&&p.catch&&p.catch(e=>console.warn('log',e&&e.code))}catch(e){console.warn('log',e)}
}
function makeDb(){
  const {fs,fns:F}=window.FB;
  const wrap=x=>({id:x.id,exists:x.exists(),data:()=>x.data(),metadata:x.metadata});
  // offline: Firestore applies the write locally and syncs later; don't block the UI waiting for the server
  const settle=p=>navigator.onLine?p:(p.catch(e=>console.error('offline write',e)),Promise.resolve());
  const dref=path=>{const r=F.doc(fs,path);const parts=path.split('/');const col=parts[parts.length-2],id=parts[parts.length-1];
    return {id:r.id,path,
    get:async()=>wrap(await F.getDoc(r)),
    set:d=>{const before=cachedDoc(col,id);return settle(F.setDoc(r,d)).then(()=>writeLog(before?'update':'create',col,id,before,d))},
    update:d=>{const before=cachedDoc(col,id);return settle(F.updateDoc(r,d)).then(()=>writeLog('update',col,id,before,before?{...before,...d}:d))},
    delete:()=>{const before=cachedDoc(col,id);return settle(F.deleteDoc(r)).then(()=>writeLog('delete',col,id,before,null))},
    onSnapshot:(n,e)=>F.onSnapshot(r,{includeMetadataChanges:true},x=>n(wrap(x)),e)}};
  const cref=path=>({path,
    doc:id=>dref(path+'/'+(id||F.doc(F.collection(fs,path)).id)),
    onSnapshot:(n,e)=>F.onSnapshot(F.collection(fs,path),{includeMetadataChanges:true},q=>n({docs:q.docs.map(wrap),metadata:q.metadata,docChanges:()=>q.docChanges().map(c=>({type:c.type,doc:wrap(c.doc)}))}),e),
    recent:(field,n,next,e)=>F.onSnapshot(F.query(F.collection(fs,path),F.orderBy(field,'desc'),F.limit(n)),q=>next(q.docs.map(x=>({...x.data(),id:x.id}))),e)});
  return {doc:dref,collection:cref};
}
function boot(){
  applyLang();
  $('#view').innerHTML=`<div class="empty"><span class="spin"></span></div>`;
  const go2=()=>{
    if(!window.FB){NODB=true;render();return}
    try{db=makeDb()}catch(e){console.error(e);NODB=true;render();return}
    FB.fns.onAuthStateChanged(FB.auth,u=>{AUTHU=u;ROLE=null;if(!u){authScreen('login');return}if(!dataStarted)resolveAccess()});
  };
  if(window.FB)go2();else{window.addEventListener('fb-ready',go2,{once:true});setTimeout(()=>{if(!window.FB){NODB=true;render()}},15000)}
}
boot();
